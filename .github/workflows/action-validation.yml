name: action-validation

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prove the action plumbing works end-to-end.
  action-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: tardigrade-action

      - name: Prepare isolated public consumer workspace
        run: |
          set -euo pipefail
          mkdir -p consumer/consumer-platforms consumer/consumer-assets
          cp tardigrade-action/profiles/mcuboot_swap_current.yaml consumer/profile.yaml
          cp tardigrade-action/platforms/cortex_m4_flash_fast.repl consumer/consumer-platforms/caller-only.repl
          cp tardigrade-action/results/oss_validation/assets/oss_mcuboot_mcuboot_swap_current_guard.elf consumer/consumer-assets/caller-only.elf
          cp tardigrade-action/results/oss_validation/assets/zephyr_slot0_padded.bin consumer/consumer-assets/caller-slot0.bin
          cp tardigrade-action/results/oss_validation/assets/zephyr_slot1_padded.bin consumer/consumer-assets/caller-slot1.bin
          python3 - <<'PY'
          from pathlib import Path
          profile = Path("consumer/profile.yaml")
          text = profile.read_text(encoding="utf-8")
          replacements = {
              "platforms/cortex_m4_flash_fast.repl": "consumer-platforms/caller-only.repl",
              "results/oss_validation/assets/oss_mcuboot_mcuboot_swap_current_guard.elf": "consumer-assets/caller-only.elf",
              "results/oss_validation/assets/zephyr_slot0_padded.bin": "consumer-assets/caller-slot0.bin",
              "results/oss_validation/assets/zephyr_slot1_padded.bin": "consumer-assets/caller-slot1.bin",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit("profile fixture is missing expected path: " + old)
              text = text.replace(old, new)
          profile.write_text(text, encoding="utf-8")
          PY
          test ! -e tardigrade-action/consumer-platforms/caller-only.repl
          test ! -e tardigrade-action/consumer-assets/caller-only.elf

      - name: Run action against public MCUboot profile (expect PASS)
        uses: ./tardigrade-action
        id: mcuboot
        with:
          profile: consumer/profile.yaml
          asset-root: consumer
          quick: "true"

      - name: Verify outputs
        run: |
          echo "verdict=${{ steps.mcuboot.outputs.verdict }}"
          echo "brick_rate=${{ steps.mcuboot.outputs.brick-rate }}"
          echo "report=${{ steps.mcuboot.outputs.report-path }}"
          test "${{ steps.mcuboot.outputs.verdict }}" = "PASS"

  # Keep the default action-validation surface narrow and stable.
  # More sensitive historical differential proofs belong in manual/data
  # collection workflows, not the default push signal for the public action.
  pr-differentials:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # PR #2100: revert magic bug (swap-move).
          # Vulnerability at fault points 2-4 out of ~15K.
          # Target first 10 points instead of full sweep.
          - name: pr2100
            broken: profiles/mcuboot_pr2100_broken_discovery.yaml
            fixed: profiles/mcuboot_pr2100_fixed_discovery.yaml
            extra_args: "--fault-end 10"
    env:
      RENODE_URL: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
      RENODE_SHA256: 62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
          python3 scripts/action_helpers.py download-renode \
            --url "${RENODE_URL}" --sha256 "${RENODE_SHA256}" --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install --user \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements.txt

      - name: "Broken ELF: must detect bricks"
        run: |
          python3 scripts/audit_bootloader.py \
            --profile "${{ matrix.broken }}" \
            --output "${RUNNER_TEMP}/${{ matrix.name }}_broken.json" \
            --renode-test "${RUNNER_TEMP}/renode/renode-test" \
            ${{ matrix.extra_args }}
          python3 -c "
          import json, sys
          r = json.load(open('${RUNNER_TEMP}/${{ matrix.name }}_broken.json'))
          sweep = r.get('summary', {}).get('runtime_sweep', {})
          issues = sweep.get('issue_points', 0) + sweep.get('bricks', 0)
          print('Broken ELF: {} issue points'.format(issues))
          if issues == 0:
              print('FAIL: tool did not detect the known bug')
              sys.exit(1)
          "

      - name: "Fixed ELF: must be clean"
        run: |
          python3 scripts/audit_bootloader.py \
            --profile "${{ matrix.fixed }}" \
            --output "${RUNNER_TEMP}/${{ matrix.name }}_fixed.json" \
            --renode-test "${RUNNER_TEMP}/renode/renode-test" \
            ${{ matrix.extra_args }}

      - name: Upload differential reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}_*.json
