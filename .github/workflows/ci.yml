name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renode-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_VERSION: 13.2.1-1.1
      TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
      TOOLCHAIN_SHA256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530
      RENODE_REVISION: d66b0c2aa3d420408eccecfd1d3bab0fd702a6db

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Certify source-release license boundary
        run: python3 scripts/license_certify.py license-certification-manifest.json --strict

      - name: Install pinned Arm GNU toolchain
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/arm-toolchain.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${TOOLCHAIN_URL}" -o "${tarball}"
          echo "${TOOLCHAIN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin/arm-none-eabi-gcc" --version

      - name: Build example firmware
        run: |
          set -euxo pipefail
          make -C examples/vulnerable_ota
          make -C examples/naive_copy
          make -C examples/nxboot_style
          make -C examples/esp_idf_ota
          python3 examples/nxboot_style/gen_nxboot_images.py --output-dir examples/nxboot_style

      - name: Run Robot suites in pinned Renode
        timeout-minutes: 30
        uses: antmicro/renode-test-action@0705567acf04d7b998d7deac1e05d9067d70d901
        env:
          RENODE_TEST: renode-test
        with:
          renode-revision: ${{ env.RENODE_REVISION }}
          renode-arguments: >-
            --test-timeout 900s
            --kill-stale-renode-instances
            --save-logs always
            --keep-renode-output
          tests-to-run: |
            tests/nvm_peripheral.robot
            tests/generic_nvm_controller.robot
            tests/cmsdk_apb_watchdog.robot
          artifacts-path: results/ci_artifacts

      - name: Upload Renode artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renode-artifacts
          path: results/ci_artifacts

  self-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      RENODE_URL: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
      RENODE_SHA256: 62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
          python3 scripts/action_helpers.py download-renode \
            --url "${RENODE_URL}" --sha256 "${RENODE_SHA256}" --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install --user \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/renode/renode-test" --help >/dev/null

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements.txt

      - name: Run discovery feature unit tests
        run: python3 tests/test_discovery_features.py

      - name: Run self-test shard ${{ matrix.shard }}/5
        run: |
          python3 scripts/self_test.py --quick \
            --shard "${{ matrix.shard }}/5" \
            --renode-test "${RUNNER_TEMP}/renode/renode-test" \
            --output results/self_test_shard_${{ matrix.shard }}.json

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-test-shard-${{ matrix.shard }}
          path: results/

  pytest:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      TOOLCHAIN_VERSION: 13.2.1-1.1
      TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
      TOOLCHAIN_SHA256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned Arm GNU toolchain
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/arm-toolchain.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${TOOLCHAIN_URL}" -o "${tarball}"
          echo "${TOOLCHAIN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin/arm-none-eabi-gcc" --version

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          python3 -m pip install -r requirements-test.txt

      - name: Run pytest suite
        run: python3 -m pytest -q
