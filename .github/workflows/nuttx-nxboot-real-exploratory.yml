name: nuttx-nxboot-real-exploratory

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      nuttx_ref:
        description: apache/nuttx ref to build
        required: true
        default: master
      nuttx_apps_ref:
        description: apache/nuttx-apps ref to build
        required: true
        default: master
      fault_budget:
        description: Target fault points across the full write range (1-4096)
        required: true
        default: "16"
      renode_url:
        description: Renode archive URL
        required: true
        default: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
      renode_sha256:
        description: SHA-256 of the Renode archive
        required: true
        default: 62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f

concurrency:
  group: nuttx-nxboot-real-exploratory-${{ github.event.inputs.nuttx_ref }}-${{ github.event.inputs.nuttx_apps_ref }}-${{ github.event.inputs.fault_budget }}-${{ github.event.inputs.renode_url }}
  cancel-in-progress: true

jobs:
  exploratory:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TOOLCHAIN_VERSION: 13.2.1-1.1
      TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
      TOOLCHAIN_SHA256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530
      RENODE_URL: ${{ inputs.renode_url }}
      RENODE_SHA256: ${{ inputs.renode_sha256 }}
      OTA_RENODE_POINT_TIMEOUT_S: "900"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install NuttX host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y kconfig-frontends || sudo apt-get install -y kconfig-frontends-nox
          # Current NuttX master uses cross-file Kconfig menu/if structures
          # (arch/arm/src/common/stm32/Kconfig.i2c) that the legacy
          # kconfig-frontends parser rejects; NuttX prefers kconfiglib when its
          # scripts are on PATH, so install it for olddefconfig/menuconfig.
          sudo python3 -m pip install -r requirements-nuttx-build.txt

      - name: Install pinned Arm GNU toolchain
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/arm-toolchain.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${TOOLCHAIN_URL}" -o "${tarball}"
          echo "${TOOLCHAIN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin/arm-none-eabi-gcc" --version

      - name: Clone upstream NuttX sources
        env:
          NUTTX_REF: ${{ inputs.nuttx_ref }}
          NUTTX_APPS_REF: ${{ inputs.nuttx_apps_ref }}
        run: |
          set -euxo pipefail
          NUTTX_REF="$(python3 scripts/action_helpers.py normalize-git-ref --name nuttx_ref --value "${NUTTX_REF}")"
          NUTTX_APPS_REF="$(python3 scripts/action_helpers.py normalize-git-ref --name nuttx_apps_ref --value "${NUTTX_APPS_REF}")"
          checkout_public_ref() {
            local url="$1" ref="$2" destination="$3"
            git init --quiet "${destination}"
            git -C "${destination}" remote add origin "${url}"
            git -C "${destination}" fetch --quiet --depth 1 origin "${ref}"
            git -C "${destination}" checkout --quiet --detach FETCH_HEAD
          }
          checkout_public_ref https://github.com/apache/nuttx.git "${NUTTX_REF}" "${RUNNER_TEMP}/nuttx"
          checkout_public_ref https://github.com/apache/nuttx-apps.git "${NUTTX_APPS_REF}" "${RUNNER_TEMP}/nuttx-apps"
          # Tracks upstream master; record exact SHAs for reproducible diagnosis.
          echo "NUTTX_SHA=$(git -C "${RUNNER_TEMP}/nuttx" rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "NUTTX_APPS_SHA=$(git -C "${RUNNER_TEMP}/nuttx-apps" rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Build real NuttX nxboot target
        run: |
          set -euo pipefail
          build_log="${RUNNER_TEMP}/nuttx-build.log"
          if python3 targets/nuttx_nxboot/build_public_target.py \
            --nuttx-root "${RUNNER_TEMP}/nuttx" \
            --apps-root "${RUNNER_TEMP}/nuttx-apps" \
            --output-dir "${RUNNER_TEMP}/nuttx-build" \
            --jobs 8 >"${build_log}" 2>&1; then
            echo "NuttX build completed. Showing final log tail:"
            tail -40 "${build_log}"
          else
            echo "::error::NuttX build failed. Showing final log tail:"
            tail -200 "${build_log}"
            exit 1
          fi

      - name: Generate runtime profile
        run: |
          python3 targets/nuttx_nxboot/generate_runtime_profile.py \
            --build-dir "${RUNNER_TEMP}/nuttx-build" \
            --output-profile "${RUNNER_TEMP}/nuttx-runtime-profile.yaml" \
            --fault-max-writes auto \
            --boot-cycles 2

      - name: Install Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
          python3 scripts/action_helpers.py download-renode \
            --url "${RENODE_URL}" --sha256 "${RENODE_SHA256}" --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install --user \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements.txt

      - name: Run exploratory audit
        env:
          FAULT_BUDGET: ${{ inputs.fault_budget }}
        run: |
          set -euo pipefail
          budget="$(python3 scripts/action_helpers.py normalize-positive-int \
            --name fault_budget --value "${FAULT_BUDGET:-16}" --maximum 4096)"
          estimated_writes=196608
          step=$(( (estimated_writes + budget - 1) / budget ))
          step_args=()
          if [ "$step" -gt 1 ]; then
            step_args+=(--fault-step "$step")
          fi
          python3 scripts/audit_bootloader.py \
            --profile "${RUNNER_TEMP}/nuttx-runtime-profile.yaml" \
            --renode-test "${RUNNER_TEMP}/renode/renode-test" \
            --workers 2 \
            --max-batch-points 16 \
            --robot-var "TEST_TIMEOUT:10 minutes" \
            "${step_args[@]}" \
            --output results/nuttx_nxboot_real_exploratory.json \
            --no-assert-verdict

      - name: Print summary
        if: always()
        run: |
          if [ -f results/nuttx_nxboot_real_exploratory.json ]; then
            python3 - <<'PY'
          import json
          import os
          payload = json.load(open("results/nuttx_nxboot_real_exploratory.json"))
          summary = payload.get("summary", {}).get("runtime_sweep", {})
          control = summary.get("control", {})
          issues = int(summary.get("issue_points") or 0)
          bricks = int(summary.get("bricks") or 0)
          cal = payload.get("calibration", {})
          print("Profile:", payload.get("profile"))
          print("NuttX:", os.environ.get("NUTTX_SHA"), "apps:", os.environ.get("NUTTX_APPS_SHA"))
          print("Verdict:", payload.get("verdict"))
          print("Calibrated writes:", cal.get("writes"))
          print("Points:", summary.get("total_fault_points"))
          print("Issues:", issues)
          print("Bricks:", bricks)
          print("Brick rate:", summary.get("brick_rate"))
          print("Control outcome:", control.get("boot_outcome"))
          mba = control.get("multi_boot_analysis") or {}
          if mba:
              print("Control multi-boot:", mba.get("status"), mba.get("final_slot"))
          failures = summary.get("failures") or []
          if failures:
              print("Representative failures:")
              for failure in failures[:10]:
                  print(json.dumps(failure, sort_keys=True))
          if issues or bricks:
              print(f"::warning::Real NuttX exploratory audit found {issues} issue points and {bricks} bricks.")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as fh:
                  fh.write("## Real NuttX nxboot exploratory summary\n")
                  fh.write(f"- Profile: `{payload.get('profile')}`\n")
                  fh.write(f"- NuttX: `{os.environ.get('NUTTX_SHA','?')}` apps: `{os.environ.get('NUTTX_APPS_SHA','?')}`\n")
                  fh.write(f"- Verdict: `{payload.get('verdict')}`\n")
                  fh.write(f"- Calibrated writes: `{cal.get('writes')}`\n")
                  fh.write(f"- Fault points: `{summary.get('total_fault_points')}`\n")
                  fh.write(f"- Issues: `{issues}`\n")
                  fh.write(f"- Bricks: `{bricks}`\n")
                  fh.write(f"- Brick rate: `{summary.get('brick_rate')}`\n")
                  fh.write(f"- Control outcome: `{control.get('boot_outcome')}`\n")
                  if mba:
                      fh.write(f"- Control multi-boot: `{mba.get('status')}` / `{mba.get('final_slot')}`\n")
          PY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuttx-nxboot-real-exploratory-results
          path: |
            results/nuttx_nxboot_real_exploratory.json
            ${{ runner.temp }}/nuttx-runtime-profile.yaml
            ${{ runner.temp }}/nuttx-build.log
