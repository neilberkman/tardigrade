name: renode-latest-canary

permissions:
  contents: read

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TOOLCHAIN_VERSION: 13.2.1-1.1
      TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
      TOOLCHAIN_SHA256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Arm GNU toolchain
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/arm-toolchain.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${TOOLCHAIN_URL}" -o "${tarball}"
          echo "${TOOLCHAIN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin/arm-none-eabi-gcc" --version

      - name: Build example firmware
        run: |
          set -euxo pipefail
          make -C examples/vulnerable_ota
          make -C examples/naive_copy
          make -C examples/nxboot_style
          make -C examples/esp_idf_ota
          python3 examples/nxboot_style/gen_nxboot_images.py --output-dir examples/nxboot_style

      - name: Install latest Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-latest.tar.gz"
          python3 scripts/action_helpers.py download-latest-github-release \
            --repository renode/renode \
            --asset-suffix .linux-portable.tar.gz \
            --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/renode/renode-test" --help >/dev/null

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Native-AOT RunFor regression test (expected FAIL)
        run: |
          set -euo pipefail
          report_dir="${RUNNER_TEMP}/nativeaot_runfor_report"
          rm -rf "${report_dir}"
          mkdir -p "${report_dir}"
          set +e
          renode-test \
            --outputdir "${report_dir}" \
            --save-logs always \
            --keep-renode-output \
            tests/nativeaot_runfor_bug.robot \
            >"${report_dir}/console.log" 2>&1
          renode_status=$?
          set -e
          report="${report_dir}/output.xml"
          if [ ! -s "${report}" ]; then
            echo "::error::Native-AOT regression produced no trustworthy Robot report"
            tail -200 "${report_dir}/console.log" || true
            exit 1
          fi
          python3 - "${report}" "${renode_status}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report_path, raw_status = sys.argv[1:]
          process_status = int(raw_status)
          try:
              root = ET.parse(report_path).getroot()
          except (OSError, ET.ParseError) as exc:
              raise SystemExit("Native-AOT Robot report is unreadable: {}".format(exc))

          tests = {
              test.get("name"): test
              for test in root.findall(".//test")
              if test.get("name")
          }
          control_name = "RunFor Completes With Built-In MappedMemory"
          regression_name = "RunFor Completes With Dynamically Compiled Peripheral On Fetch Path"
          missing = [name for name in (control_name, regression_name) if name not in tests]
          if missing:
              raise SystemExit(
                  "Native-AOT Robot report is missing expected test(s): {}".format(
                      ", ".join(missing)
                  )
              )

          def status(test):
              node = test.find("status")
              return node.get("status") if node is not None else None

          control_status = status(tests[control_name])
          regression_status = status(tests[regression_name])
          print(
              "Native-AOT expected failure: process_status={}, control={}, regression={}".format(
                  process_status, control_status, regression_status
              )
          )
          if process_status == 0:
              raise SystemExit("Native-AOT regression unexpectedly succeeded")
          if control_status != "PASS" or regression_status != "FAIL":
              raise SystemExit(
                  "Native-AOT report did not show the expected control PASS / regression FAIL"
              )
          PY

      - name: Run latest-Renode canary suites
        timeout-minutes: 35
        run: |
          set -euxo pipefail
          mkdir -p results/renode_latest_canary
          renode-test --test-timeout 900s --kill-stale-renode-instances --save-logs always --keep-renode-output tests/nvm_peripheral.robot
          python3 scripts/audit_bootloader.py \
            --profile profiles/mcuboot_swap_current.yaml \
            --quick \
            --renode-test renode-test \
            --output results/renode_latest_canary/mcuboot_audit.json

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renode-latest-canary
          path: |
            results/renode_latest_canary
            results/renode_runs
            output.xml
            log.html
            report.html
            logs/
