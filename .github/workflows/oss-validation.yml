name: oss-validation

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/setup-oss-validation/**
      - .github/workflows/oss-validation.yml
      - action.yml
      - docker/oss-validation.Dockerfile
      - docs/oss_validation_profiles.json
      - examples/**
      - peripherals/**
      - platforms/**
      - profiles/**
      - 'requirements*.txt'
      - scripts/**
      - targets/**
      - tests/**
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recent-activity:
    runs-on: ubuntu-22.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed="$(
            git log \
              --since='24 hours ago' \
              --name-only \
              --pretty=format: \
              -- \
              .github/workflows/oss-validation.yml \
              .github/actions/setup-oss-validation \
              action.yml \
              docker/oss-validation.Dockerfile \
              docs/oss_validation_profiles.json \
              examples \
              peripherals \
              platforms \
              profiles \
              'requirements*.txt' \
              scripts \
              targets \
              tests \
            | sed '/^$/d' \
            | sort -u
          )"

          if [ -n "${changed}" ]; then
            echo "Recent relevant activity detected:"
            echo "${changed}"
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No relevant activity in the last 24 hours; skipping scheduled OSS validation."
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
          fi

  bootstrapped-guards:
    needs: recent-activity
    if: needs.recent-activity.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up build and validation dependencies
        uses: ./.github/actions/setup-oss-validation
        with:
          install-host-packages: "true"
          install-toolchain: "true"

      - name: Run MCUboot current guard (must pass)
        run: |
          set -euxo pipefail
          export GNUARMEMB_TOOLCHAIN_PATH="$HOME/tools/gcc-arm-none-eabi-8-2018-q4-major"
          ./scripts/bootstrap_mcuboot_matrix_assets.sh
          python3 scripts/run_oss_validation.py \
            --manifest docs/oss_validation_profiles.json \
            --profile mcuboot_swap_current_guard \
            --renode-test renode-test \
            --output results/oss_validation/mcuboot_swap_current_guard.json

      - name: Run MCUboot PR2100 broken guard (must detect issues)
        run: |
          set -euxo pipefail
          python3 scripts/audit_bootloader.py \
            --profile profiles/mcuboot_pr2100_broken_discovery.yaml \
            --output results/oss_validation/mcuboot_pr2100_broken_discovery.json \
            --renode-test renode-test \
            --fault-end 10

      - name: Run MCUboot PR2100 fixed control (must pass)
        run: |
          set -euxo pipefail
          python3 scripts/audit_bootloader.py \
            --profile profiles/mcuboot_pr2100_fixed_discovery.yaml \
            --output results/oss_validation/mcuboot_pr2100_fixed_discovery.json \
            --renode-test renode-test \
            --fault-end 10

      - name: Upload bootstrapped guard artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oss-validation-bootstrapped-guards
          path: |
            results/oss_validation
            results/renode_runs

  recovery-state:
    needs: recent-activity
    if: needs.recent-activity.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - broken
          - fixed

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up validation dependencies
        uses: ./.github/actions/setup-oss-validation

      - name: Run MCUboot PR3011 ${{ matrix.variant }} recovery-state profile
        run: |
          set -euxo pipefail
          python3 scripts/audit_bootloader.py \
            --profile "profiles/mcuboot_pr3011_move_${{ matrix.variant }}_state_search.yaml" \
            --output "results/oss_validation/mcuboot_pr3011_move_${{ matrix.variant }}_state_search.json" \
            --renode-test renode-test \
            --quick --workers 1 --strict-profile

      - name: Upload recovery-state artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oss-validation-recovery-state-${{ matrix.variant }}
          path: |
            results/oss_validation
            results/renode_runs
