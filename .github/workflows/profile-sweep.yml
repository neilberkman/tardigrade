name: profile-sweep

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile YAML to sweep (relative to repo root)
        required: true
        default: profiles/mcuboot_swap_current.yaml
      workers:
        description: Parallel Renode workers
        required: false
        default: "2"
      exhaustive:
        description: Sweep all fault points for the selected profile
        type: boolean
        required: false
        default: false

concurrency:
  group: profile-sweep-${{ github.event.inputs.profile }}-${{ github.event.inputs.exhaustive }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RENODE_URL: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
      RENODE_SHA256: 62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
          python3 scripts/action_helpers.py download-renode \
            --url "${RENODE_URL}" --sha256 "${RENODE_SHA256}" --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install --user \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements.txt

      - name: Run profile sweep
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
          WORKERS_INPUT: ${{ inputs.workers }}
          EXHAUSTIVE_INPUT: ${{ inputs.exhaustive }}
        run: |
          args=(
            --profile "${PROFILE_INPUT}"
            --renode-test "${RUNNER_TEMP}/renode/renode-test"
            --output results/profile_sweep.json
            --workers "${WORKERS_INPUT}"
          )
          if [ "${EXHAUSTIVE_INPUT}" = "true" ]; then
            args+=(--fault-start 0)
          fi
          # Don't fail on verdict assertions — this workflow is for data collection.
          # The summary step prints the verdict for human review.
          args+=(--no-assert-verdict)
          python3 scripts/audit_bootloader.py "${args[@]}"

      - name: Print summary
        if: always()
        run: |
          if [ -f results/profile_sweep.json ]; then
            python3 -c "
          import json
          r = json.load(open('results/profile_sweep.json'))
          s = r.get('summary', {}).get('runtime_sweep', {})
          t = s.get('timing', {}).get('averages', {})
          print('Profile:', r.get('profile'))
          print('Verdict:', r.get('verdict'))
          print('Points:', s.get('total_fault_points'))
          print('Bricks:', s.get('bricks'))
          print('Brick rate:', s.get('brick_rate'))
          print('Wall time: {:.1f}s'.format(s.get('wall_time_s', 0)))
          print('Avg per-point: {}ms (emu={}ms)'.format(t.get('total_ms'), t.get('emulation_ms')))
          "
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-sweep-results
          path: results/profile_sweep.json
