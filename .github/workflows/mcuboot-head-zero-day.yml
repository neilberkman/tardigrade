name: mcuboot-head-zero-day

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mcuboot_ref:
        description: Public mcu-tools/mcuboot ref to build
        required: true
        default: main
      renode_url:
        description: Renode archive URL
        required: true
        default: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
      renode_sha256:
        description: SHA-256 of the Renode archive
        required: true
        default: 62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f

concurrency:
  group: mcuboot-head-zero-day-${{ github.event.inputs.mcuboot_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TOOLCHAIN_VERSION: 13.2.1-1.1
      TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
      TOOLCHAIN_SHA256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl device-tree-compiler git make \
            ninja-build python3 python3-pip python3-venv xz-utils

      - name: Install pinned Arm GNU toolchain
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/arm-toolchain.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${TOOLCHAIN_URL}" -o "${tarball}"
          echo "${TOOLCHAIN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          mkdir -p "$HOME/tools"
          ln -s "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}" \
            "$HOME/tools/gcc-arm-none-eabi-8-2018-q4-major"
          echo "$HOME/tools/gcc-arm-none-eabi-8-2018-q4-major/bin" >> "${GITHUB_PATH}"

      - name: Install build dependencies
        run: python3 -m pip install --user -r requirements-oss-build.txt

      - name: Build current MCUboot matrix
        env:
          MCUBOOT_REF_INPUT: ${{ inputs.mcuboot_ref }}
        run: |
          set -euxo pipefail
          ref="$(python3 scripts/action_helpers.py normalize-git-ref \
            --name mcuboot_ref --value "${MCUBOOT_REF_INPUT}")"
          export GNUARMEMB_TOOLCHAIN_PATH="$HOME/tools/gcc-arm-none-eabi-8-2018-q4-major"
          ./scripts/bootstrap_mcuboot_matrix_assets.sh
          MCUBOOT_REF="${ref}" ./scripts/build_mcuboot_head_matrix.sh
          echo "Built MCUboot $(cat results/oss_validation/assets/mcuboot_head_commit.txt)"

      - name: Upload current-head assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcuboot-current-head-assets
          retention-days: 1
          path: |
            results/oss_validation/assets/mcuboot_head_commit.txt
            results/oss_validation/assets/oss_mcuboot_head_*.elf
            results/oss_validation/assets/zephyr_head_*.bin

  sweep:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: profiles/mcuboot_head_move_nrf52_revert_full_fault_coverage.yaml
            slug: move-nrf52-revert
          - profile: profiles/mcuboot_head_offset_nrf52_revert_extended.yaml
            slug: offset-nrf52-revert
          - profile: profiles/mcuboot_head_scratch_nrf52_revert_extended.yaml
            slug: scratch-nrf52-revert
          - profile: profiles/mcuboot_head_scratch_stm32f4_writeback.yaml
            slug: scratch-stm32f4-writeback
    env:
      RENODE_URL: ${{ inputs.renode_url }}
      RENODE_SHA256: ${{ inputs.renode_sha256 }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download current-head assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcuboot-current-head-assets
          path: results/oss_validation/assets

      - name: Install Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
          python3 scripts/action_helpers.py download-renode \
            --url "${RENODE_URL}" --sha256 "${RENODE_SHA256}" --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install --user \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements.txt

      - name: Run quick zero-day sweep
        env:
          PROFILE_INPUT: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          slug="$(basename "${PROFILE_INPUT}" .yaml)"
          python3 scripts/audit_bootloader.py \
            --profile "${PROFILE_INPUT}" \
            --renode-test "${RUNNER_TEMP}/renode/renode-test" \
            --workers 2 \
            --max-batch-points 32 \
            --quick \
            --no-assert-verdict \
            --output "results/${slug}.json"

      - name: Print summary
        if: always()
        env:
          PROFILE_INPUT: ${{ matrix.profile }}
        run: |
          slug="$(basename "${PROFILE_INPUT}" .yaml)"
          result="results/${slug}.json"
          if [ -f "${result}" ]; then
            python3 - "${result}" <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1]))
          summary = report.get("summary", {}).get("runtime_sweep", {})
          print("MCUboot:", open("results/oss_validation/assets/mcuboot_head_commit.txt").read().strip())
          print("Profile:", report.get("profile"))
          print("Verdict:", report.get("verdict"))
          print("Points:", summary.get("total_fault_points"))
          print("Issues:", summary.get("issue_points", 0))
          print("Bricks:", summary.get("bricks", 0))
          PY
          fi

      - name: Upload sweep result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcuboot-zero-day-${{ matrix.slug }}
          path: |
            results/*.json
            results/oss_validation/assets/mcuboot_head_commit.txt
