name: nuttx-nxboot-multi-fault-canary

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      nuttx_ref:
        description: apache/nuttx ref to build
        required: true
        default: master
      nuttx_apps_ref:
        description: apache/nuttx-apps ref to build
        required: true
        default: master
      fault_budget:
        description: Target fault points per fault type (1-4096)
        required: true
        default: "32"
      renode_url:
        description: Renode archive URL
        required: true
        default: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
      renode_sha256:
        description: SHA-256 of the Renode archive
        required: true
        default: 62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f
  schedule:
    - cron: "0 9 * * 0"

concurrency:
  # Manual configurations are independent experiments and must not cancel one
  # another. Scheduled runs still collapse onto one stable group.
  group: nuttx-multi-fault-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_VERSION: 13.2.1-1.1
      TOOLCHAIN_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
      TOOLCHAIN_SHA256: 1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install NuttX host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y kconfig-frontends || sudo apt-get install -y kconfig-frontends-nox
          # Current NuttX master uses cross-file Kconfig menu/if structures
          # (arch/arm/src/common/stm32/Kconfig.i2c) that the legacy
          # kconfig-frontends parser rejects; NuttX prefers kconfiglib when its
          # scripts are on PATH, so install it for olddefconfig/menuconfig.
          sudo python3 -m pip install -r requirements-nuttx-build.txt

      - name: Install pinned Arm GNU toolchain
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/arm-toolchain.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${TOOLCHAIN_URL}" -o "${tarball}"
          echo "${TOOLCHAIN_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xpack-arm-none-eabi-gcc-${TOOLCHAIN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Clone upstream NuttX sources
        env:
          NUTTX_REF: ${{ inputs.nuttx_ref || 'master' }}
          NUTTX_APPS_REF: ${{ inputs.nuttx_apps_ref || 'master' }}
        run: |
          set -euxo pipefail
          NUTTX_REF="$(python3 scripts/action_helpers.py normalize-git-ref --name nuttx_ref --value "${NUTTX_REF}")"
          NUTTX_APPS_REF="$(python3 scripts/action_helpers.py normalize-git-ref --name nuttx_apps_ref --value "${NUTTX_APPS_REF}")"
          checkout_public_ref() {
            local url="$1" ref="$2" destination="$3"
            git init --quiet "${destination}"
            git -C "${destination}" remote add origin "${url}"
            git -C "${destination}" fetch --quiet --depth 1 origin "${ref}"
            git -C "${destination}" checkout --quiet --detach FETCH_HEAD
          }
          checkout_public_ref https://github.com/apache/nuttx.git "${NUTTX_REF}" "${RUNNER_TEMP}/nuttx"
          checkout_public_ref https://github.com/apache/nuttx-apps.git "${NUTTX_APPS_REF}" "${RUNNER_TEMP}/nuttx-apps"
          # The canary intentionally tracks upstream master; record the exact
          # SHAs so a failure is reproducible/diffable without freezing what it
          # builds against.
          echo "NUTTX_SHA=$(git -C "${RUNNER_TEMP}/nuttx" rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "NUTTX_APPS_SHA=$(git -C "${RUNNER_TEMP}/nuttx-apps" rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Build real NuttX nxboot target
        run: |
          python3 targets/nuttx_nxboot/build_public_target.py \
            --nuttx-root "${RUNNER_TEMP}/nuttx" \
            --apps-root "${RUNNER_TEMP}/nuttx-apps" \
            --output-dir build-artifacts \
            --jobs 8

      - name: Record build provenance
        run: |
          python3 - <<'PY'
          import json, os, glob, hashlib
          arts = {}
          for p in sorted(glob.glob("build-artifacts/**/*", recursive=True)):
              if os.path.isfile(p):
                  b = open(p, "rb").read()
                  arts[os.path.relpath(p, "build-artifacts")] = {
                      "bytes": len(b),
                      "sha256": hashlib.sha256(b).hexdigest(),
                  }
          prov = {
              "nuttx_repo": "https://github.com/apache/nuttx",
              "nuttx_sha": os.environ.get("NUTTX_SHA", ""),
              "nuttx_apps_repo": "https://github.com/apache/nuttx-apps",
              "nuttx_apps_sha": os.environ.get("NUTTX_APPS_SHA", ""),
              "artifacts": arts,
          }
          json.dump(prov, open("build-artifacts/provenance.json", "w"), indent=2)
          print(json.dumps(prov, indent=2))
          sm = os.environ.get("GITHUB_STEP_SUMMARY")
          if sm:
              with open(sm, "a") as fh:
                  fh.write("## Build provenance\n")
                  fh.write("- apache/nuttx @ `" + prov["nuttx_sha"] + "`\n")
                  fh.write("- apache/nuttx-apps @ `" + prov["nuttx_apps_sha"] + "`\n")
                  for k, v in arts.items():
                      fh.write("- `" + k + "`: " + str(v["bytes"]) + " bytes, sha256 `" + v["sha256"][:16] + "`\n")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nxboot-build
          path: build-artifacts/
          retention-days: 1

  sweep:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        fault_type:
          - power_loss
          - bit_corruption
          - instruction_skip
    env:
      RENODE_URL: ${{ inputs.renode_url || 'https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz' }}
      RENODE_SHA256: ${{ inputs.renode_sha256 || '62629caa331ed4bd4eb7abe13ee2e4834fbcaa70de492db3965fafa4edc5694f' }}
      OTA_RENODE_POINT_TIMEOUT_S: "900"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nxboot-build
          path: build-artifacts

      - name: Generate profile for ${{ matrix.fault_type }}
        run: |
          python3 targets/nuttx_nxboot/generate_runtime_profile.py \
            --build-dir build-artifacts \
            --output-profile profile.yaml \
            --fault-max-writes auto \
            --boot-cycles 2 \
            --fault-types "${{ matrix.fault_type }}" \
            --name "nuttx_nxboot_${{ matrix.fault_type }}"

      - name: Install Renode portable
        run: |
          set -euxo pipefail
          tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
          python3 scripts/action_helpers.py download-renode \
            --url "${RENODE_URL}" --sha256 "${RENODE_SHA256}" --output "${tarball}"
          mkdir -p "${RUNNER_TEMP}/renode"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/renode" --strip-components=1
          python3 -m pip install --user \
            -c requirements-renode-constraints.txt \
            -r "${RUNNER_TEMP}/renode/tests/requirements.txt"
          echo "${RUNNER_TEMP}/renode" >> "${GITHUB_PATH}"

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements.txt

      - name: Run ${{ matrix.fault_type }} sweep
        env:
          FAULT_BUDGET: ${{ inputs.fault_budget || '32' }}
        run: |
          set -euo pipefail
          budget="$(python3 scripts/action_helpers.py normalize-positive-int \
            --name fault_budget --value "${FAULT_BUDGET:-32}" --maximum 4096)"
          estimated_writes=196608
          step=$(( (estimated_writes + budget - 1) / budget ))
          step_args=()
          if [ "$step" -gt 1 ]; then
            step_args+=(--fault-step "$step")
          fi
          python3 scripts/audit_bootloader.py \
            --profile profile.yaml \
            --renode-test "${RUNNER_TEMP}/renode/renode-test" \
            --workers 2 \
            --max-batch-points 16 \
            --robot-var "TEST_TIMEOUT:10 minutes" \
            "${step_args[@]}" \
            --output "results/nuttx_nxboot_${{ matrix.fault_type }}.json"

      - name: Print summary
        if: always()
        run: |
          result="results/nuttx_nxboot_${{ matrix.fault_type }}.json"
          if [ -f "$result" ]; then
            python3 - <<PY
          import json, os
          p = json.load(open("$result"))
          s = p.get("summary", {}).get("runtime_sweep", {})
          prov = {}
          if os.path.exists("build-artifacts/provenance.json"):
              prov = json.load(open("build-artifacts/provenance.json"))
          print("Fault type: ${{ matrix.fault_type }}")
          print("NuttX:", prov.get("nuttx_sha"), "apps:", prov.get("nuttx_apps_sha"))
          print("Verdict:", p.get("verdict"))
          print("Points:", s.get("total_fault_points"))
          print("Issues:", s.get("issue_points", 0))
          print("Bricks:", s.get("bricks", 0))
          print("Brick rate:", s.get("brick_rate"))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as fh:
                  fh.write("## ${{ matrix.fault_type }}\n")
                  fh.write(f"- NuttX: \`{prov.get('nuttx_sha','?')}\` apps: \`{prov.get('nuttx_apps_sha','?')}\`\n")
                  fh.write(f"- Verdict: \`{p.get('verdict')}\`\n")
                  fh.write(f"- Points: \`{s.get('total_fault_points')}\`\n")
                  fh.write(f"- Issues: \`{s.get('issue_points', 0)}\`\n")
                  fh.write(f"- Bricks: \`{s.get('bricks', 0)}\`\n")
                  fh.write(f"- Brick rate: \`{s.get('brick_rate')}\`\n")
          PY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuttx-nxboot-${{ matrix.fault_type }}-results
          path: |
            results/nuttx_nxboot_${{ matrix.fault_type }}.json
            profile.yaml
            build-artifacts/provenance.json
