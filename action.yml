name: Tardigrade OTA Resilience Audit
description: >
  Run fault-injection testing against an embedded bootloader.
  Provide a profile YAML and referenced assets; Tardigrade installs Renode,
  runs the selected campaign or analyzer, and returns assertion and security status.

inputs:
  profile:
    description: Path to profile YAML (relative to caller's workspace)
    required: true
  quick:
    description: >-
      Smoke test; by default selects first/middle/last per enabled fault family.
      Profiles with quick_use_heuristic use their configured heuristic set and
      do not apply ordinary three-point reductions to other enabled families.
    required: false
    default: "true"
  renode-url:
    description: Renode portable tarball URL
    required: false
    default: https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
  renode-sha256:
    description: SHA-256 of the Renode portable tarball
    required: false
    # Published by renode/renode release metadata for v1.16.1.
    default: 00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0
  asset-root:
    description: Directory, relative to the caller workspace, used to resolve profile assets
    required: false
    default: "."
  workers:
    description: Number of parallel Renode workers for sweep
    required: false
    default: "2"
  regression-mode:
    description: Allow expected-finding profiles to pass their regression assertion
    required: false
    default: "false"

outputs:
  verdict:
    description: PASS only when the default security gate, or explicit regression gate, passes
    value: ${{ steps.run.outputs.verdict }}
  assertion-status:
    description: PASS when observed results match the profile expect block
    value: ${{ steps.run.outputs.assertion_status }}
  security-status:
    description: CLEAN, FINDINGS, or INCONCLUSIVE independent of regression expectations
    value: ${{ steps.run.outputs.security_status }}
  issue-points:
    description: Total issue points across enabled fault campaigns
    value: ${{ steps.run.outputs.issue_points }}
  security-bypass-points:
    description: Instruction-skip points classified as security bypasses
    value: ${{ steps.run.outputs.security_bypass_points }}
  brick-rate:
    description: Fraction of fault points that bricked the device
    value: ${{ steps.run.outputs.brick_rate }}
  report-path:
    description: Path to JSON report for artifact upload
    value: ${{ steps.run.outputs.report_path }}

runs:
  using: composite
  steps:
    - name: Prepare isolated open-source runtime
      id: runtime
      shell: bash
      env:
        TARDIGRADE_ACTION_PATH: ${{ github.action_path }}
        RENODE_URL_INPUT: ${{ inputs.renode-url }}
        RENODE_SHA256_INPUT: ${{ inputs.renode-sha256 }}
        RUNNER_OS_INPUT: ${{ runner.os }}
        RUNNER_ARCH_INPUT: ${{ runner.arch }}
      run: |
        set -euo pipefail
        TARDIGRADE="${TARDIGRADE_ACTION_PATH}"
        if [ ! -d "${TARDIGRADE}" ] && [ -d "/__w${TARDIGRADE#/home/runner/work}" ]; then
          TARDIGRADE="/__w${TARDIGRADE#/home/runner/work}"
        fi
        helper="${TARDIGRADE}/scripts/action_helpers.py"
        python3 "${helper}" validate-runner \
          --os "${RUNNER_OS_INPUT}" --arch "${RUNNER_ARCH_INPUT}" >/dev/null

        runtime_root="$(mktemp -d "${RUNNER_TEMP}/tardigrade-runtime.XXXXXX")"
        renode_dir="${runtime_root}/renode"
        venv_dir="${runtime_root}/venv"
        tarball="${RUNNER_TEMP}/renode-portable.tar.gz"
        python3 "${helper}" download-renode \
          --url "${RENODE_URL_INPUT}" \
          --sha256 "${RENODE_SHA256_INPUT}" \
          --output "${tarball}"
        mkdir -p "${renode_dir}"
        tar -xzf "${tarball}" -C "${renode_dir}" --strip-components=1
        python3 -m venv "${venv_dir}"
        "${venv_dir}/bin/python" -m pip install \
          -c "${TARDIGRADE}/requirements-renode-constraints.txt" \
          -r "${renode_dir}/tests/requirements.txt"
        "${venv_dir}/bin/python" -m pip install \
          -r "${TARDIGRADE}/requirements.txt"
        "${venv_dir}/bin/python" -m pip check
        echo "renode_dir=${renode_dir}" >> "${GITHUB_OUTPUT}"
        echo "venv_python=${venv_dir}/bin/python" >> "${GITHUB_OUTPUT}"

    - name: Run audit
      id: run
      shell: bash
      env:
        TARDIGRADE_ACTION_PATH: ${{ github.action_path }}
        PROFILE_INPUT: ${{ inputs.profile }}
        ASSET_ROOT_INPUT: ${{ inputs.asset-root }}
        QUICK_INPUT: ${{ inputs.quick }}
        WORKERS_INPUT: ${{ inputs.workers }}
        REGRESSION_MODE_INPUT: ${{ inputs.regression-mode }}
        TARDIGRADE_RENODE_DIR: ${{ steps.runtime.outputs.renode_dir }}
        TARDIGRADE_VENV_PYTHON: ${{ steps.runtime.outputs.venv_python }}
      run: |
        set -euo pipefail
        TARDIGRADE="${TARDIGRADE_ACTION_PATH}"
        # Fix path inside Docker containers: host /home/runner/work maps to /__w
        if [ ! -d "${TARDIGRADE}" ] && [ -d "/__w${TARDIGRADE#/home/runner/work}" ]; then
          TARDIGRADE="/__w${TARDIGRADE#/home/runner/work}"
        fi
        helper="${TARDIGRADE}/scripts/action_helpers.py"
        REPORT="${RUNNER_TEMP}/tardigrade_report.json"
        export PATH="$(dirname "${TARDIGRADE_VENV_PYTHON}"):${TARDIGRADE_RENODE_DIR}:${PATH}"

        QUICK="$("${TARDIGRADE_VENV_PYTHON}" "${helper}" normalize-bool \
          --name quick --value "${QUICK_INPUT}")"
        WORKERS="$("${TARDIGRADE_VENV_PYTHON}" "${helper}" normalize-positive-int \
          --name workers --value "${WORKERS_INPUT}" --maximum 64)"
        REGRESSION_MODE="$("${TARDIGRADE_VENV_PYTHON}" "${helper}" normalize-bool \
          --name regression-mode --value "${REGRESSION_MODE_INPUT}")"
        PROFILE="$("${TARDIGRADE_VENV_PYTHON}" "${helper}" resolve \
          --workspace "${GITHUB_WORKSPACE}" \
          --path "${PROFILE_INPUT}" \
          --kind file)"
        ASSET_ROOT="$("${TARDIGRADE_VENV_PYTHON}" "${helper}" resolve \
          --workspace "${GITHUB_WORKSPACE}" \
          --path "${ASSET_ROOT_INPUT}" \
          --kind directory)"

        # Remove stale report from prior invocation.
        rm -f "${REPORT}"

        args=(
          --profile "${PROFILE}"
          --output "${REPORT}"
          --renode-test "${TARDIGRADE_RENODE_DIR}/renode-test"
          --repo-root "${ASSET_ROOT}"
          --robot-suite "${TARDIGRADE}/tests/ota_fault_point.robot"
          --strict-profile
        )
        if [ "${QUICK}" = "true" ]; then
          args+=(--quick)
        fi
        if [ "${WORKERS}" != "1" ]; then
          args+=(--workers "${WORKERS}")
        fi

        set +e
        "${TARDIGRADE_VENV_PYTHON}" "${TARDIGRADE}/scripts/audit_bootloader.py" "${args[@]}"
        audit_exit=$?
        set -e

        if [ ! -f "${REPORT}" ]; then
          echo "verdict=FAIL" >> "${GITHUB_OUTPUT}"
          echo "assertion_status=FAIL" >> "${GITHUB_OUTPUT}"
          echo "security_status=INCONCLUSIVE" >> "${GITHUB_OUTPUT}"
          echo "issue_points=0" >> "${GITHUB_OUTPUT}"
          echo "security_bypass_points=0" >> "${GITHUB_OUTPUT}"
          echo "brick_rate=-1" >> "${GITHUB_OUTPUT}"
          echo "report_path=" >> "${GITHUB_OUTPUT}"
          echo "::error::Audit produced no report (exit ${audit_exit})"
          exit 1
        fi

        publish_args=(
          --report "${REPORT}"
          --github-output "${GITHUB_OUTPUT}"
          --audit-exit "${audit_exit}"
        )
        if [ "${REGRESSION_MODE}" = "true" ]; then
          publish_args+=(--regression-mode)
        fi
        if ! "${TARDIGRADE_VENV_PYTHON}" "${helper}" publish-report "${publish_args[@]}"; then
          echo "::error::Tardigrade audit failed its assertion or security gate"
          exit 1
        fi
