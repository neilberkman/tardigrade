schema_version: 1
name: heuristic_mram_trace
description: Synthetic direct-MRAM trace and heuristic-planning regression.
platform: platforms/cortex_m0_mram.repl
bootloader:
  elf: examples/heuristic_mram_trace/firmware.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20002000 }
  write_granularity: 8
  page_size: 0x1000
  trace_address_map:
    - { offset_start: 0x0, offset_end: 0x4000, address_addend: 0x10100000 }
  slots:
    exec: { base: 0x10100000, size: 0x2000 }
    staging: { base: 0x10102000, size: 0x2000 }
images:
  staging: examples/heuristic_mram_trace/firmware.bin
flash_backend: mram
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x20000020
  marker_value: 0x51A7C0DE
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss]
  max_writes: auto
  max_writes_cap: 128
  sweep_strategy: heuristic
  max_heuristic_points: 8
  heuristic:
    preserve_critical_tiers: false
  run_duration: "0.1"
expect:
  should_find_issues: false
