base_profile: profile.yaml
name: deliberate_crash_report_fault_forges_checks
description: Negative variant whose firmware faults before its memory success checks hold, then writes the check addresses from inside the fault handler.
images:
  exec: examples/deliberate_crash_report/fault_forges_checks.bin
fault_sweep:
  max_writes: 0
expect:
  control_outcome: hard_fault
  allow_control_only_issues: true
  should_find_issues: true
