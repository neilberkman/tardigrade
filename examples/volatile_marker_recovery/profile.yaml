schema_version: 1
name: volatile_marker_recovery
description: Synthetic stale-SRAM recovery-marker regression with stall evidence.
platform: platforms/cortex_m0_mapped_faultctrl.repl
bootloader:
  elf: examples/volatile_marker_recovery/firmware.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20002000 }
  write_granularity: 4
  page_size: 0x1000
  slots:
    exec: { base: 0x10000000, size: 0x1000 }
    staging: { base: 0x10001000, size: 0x1000 }
images:
  staging: examples/volatile_marker_recovery/firmware.bin
flash_backend: faultFlash
success_criteria:
  marker_address: 0x20000100
  marker_value: 0x5A1ECA1B
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss]
  max_writes: auto
  max_writes_cap: 4
  sweep_strategy: exhaustive
  run_duration: "0.1"
  progress_stall_timeout_s: 0.1
expect:
  should_find_issues: true
