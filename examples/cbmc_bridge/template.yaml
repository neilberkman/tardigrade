# Template profile for the CBMC bridge example.
#
# cbmc_to_profile.py copies this and injects pre_boot_state writes
# derived from the CBMC counterexample.  The metadata region lives at
# 0x10070000 (immediately after the two 224 KB firmware slots).
schema_version: 1
name: cbmc_bridge_example
description: >-
  Template for CBMC-to-Tardigrade bridge demo.  Uses the vulnerable OTA
  firmware that copies staging over the active slot with no recovery.
platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/vulnerable_ota/firmware.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 8
  slots:
    exec:    { base: 0x10000000, size: 0x38000 }
    staging: { base: 0x10038000, size: 0x38000 }
images:
  staging: examples/vulnerable_ota/firmware.bin
success_criteria:
  vtor_in_slot: exec
fault_sweep:
  mode: runtime
  max_writes: 28672
  max_writes_cap: 100000
  run_duration: "0.01"
expect:
  should_find_issues: true
