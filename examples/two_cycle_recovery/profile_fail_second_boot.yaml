base_profile: profile.yaml
name: two_cycle_recovery_fail_second_boot
description: >
  Two-cycle companion whose torn-record fault points boot cleanly on cycle 0
  and hard-fault before memory checks hold on cycle 1
  (status=failed_after_success). Must count those points as bricks and boot
  mismatches using cycle 1's signals.
images:
  exec: examples/two_cycle_recovery/fail_second_boot.bin
fault_sweep:
  boot_cycles: 2
