[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tardigrade"
version = "0.6.0.dev0"
description = "Profile-driven firmware update fault-injection audits, starter profiles and reports"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
dependencies = [
    "PyYAML==6.0.3", "pyelftools==0.32", "capstone==5.0.7", "devicetree==0.0.2",
    "robotframework==6.1", "robotframework-retryfailed==0.2.0", "psutil==7.2.2",
    "telnetlib3==2.0.8",
]

[project.scripts]
tardigrade = "tardigrade.cli:main"

[tool.setuptools]
packages = ["tardigrade", "tardigrade.runtime"]
package-dir = {"tardigrade.runtime" = "."}
include-package-data = false

[tool.setuptools.package-data]
"tardigrade.runtime" = [
    "platforms/*.repl",
    "peripherals/*.cs",
    "scripts/*.py",
    "scripts/*.resc",
    "tests/ota_fault_point.robot",
    "targets/*/*.py",
    "profiles/naive_bare_copy.yaml",
    "profiles/demo_mcuboot_offset_upgrade.yaml",
    "profiles/mcuboot_offset_upgrade.yaml",
    "examples/mram_ecc_record_recovery/profile_handled.yaml",
    "examples/vulnerable_ota/firmware.elf",
    "examples/vulnerable_ota/firmware.bin",
    "results/oss_validation/assets/oss_mcuboot_head_offset.elf",
    "results/oss_validation/assets/zephyr_slot0_padded.bin",
    "results/oss_validation/assets/zephyr_slot1_padded.bin",
]
