schema_version: 1
name: nxboot_style_instruction_skip_probe
description: >
  Instruction-skip fault injection against nxboot-style bootloader with
  verification bypass probing enabled. Records validate_image return values
  so sweeps can distinguish pure crashes from genuine verification bypasses.
platform: platforms/cortex_m0_mapped_faultctrl.repl
flash_backend: faultFlash
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  run_duration: "0.5"
  phase1_time_slice: "0.10"
  fault_types: [instruction_skip]
  instruction_skip_config:
    target_addresses:
      - { symbol: validate_image }
  verification_bypass_probe:
    enabled: true
    probe_functions:
      - symbol: validate_image
        expected_success_value: 0
        layer: image_validation
skip_self_test: true
expect:
  should_find_issues: false
