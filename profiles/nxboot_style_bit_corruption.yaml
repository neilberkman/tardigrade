schema_version: 1
name: nxboot_style_bit_corruption
description: >
  Standalone nxboot-style bootloader under bit-corruption faults.
  A single-bit flip during any flash write should not brick the device —
  the bootloader should either complete the update or revert to
  the confirmed primary.
platform: platforms/cortex_m0_mapped.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
  image_hash: true
  image_hash_slot: exec
  expected_image: staging
fault_sweep:
  mode: runtime
  run_duration: "0.5"
  max_writes: 2048
  fault_types: [bit_corruption]
expect:
  should_find_issues: false
