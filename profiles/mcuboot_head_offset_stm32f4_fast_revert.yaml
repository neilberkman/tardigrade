schema_version: 1
name: mcuboot_head_offset_stm32f4_fast_revert
description: >
  Zero-day hunt: MCUboot HEAD swap-offset revert on nucleo_f429zi.
  Non-uniform flash sectors. Revert path with different-sized images.

platform: platforms/stm32f4_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_offset_stm32f4.elf
  entry: 0x08000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08020000, size: 0x60000 }
    staging: { base: 0x08080000, size: 0x60000 }
images:
  exec: results/oss_validation/assets/zephyr_head_offset_stm32f4_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_offset_stm32f4_slot0.bin
# Primary slot ends at 0x08080000. Trailer magic at 0x0807FFF0.
pre_boot_state:
  - { address: 0x0807FFF0, u32: 0xF395C277 }
  - { address: 0x0807FFF4, u32: 0x7FEFD260 }
  - { address: 0x0807FFF8, u32: 0x0F505235 }
  - { address: 0x0807FFFC, u32: 0x8079B62C }
  - { address: 0x0807FFE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x00020014
  marker_value: 0x00000001
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
