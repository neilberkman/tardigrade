schema_version: 1
name: mcuboot_head_move_nrf52_revert_full_fault_coverage_nohashbypass
description: >
  MCUboot HEAD swap-move revert on nrf52840dk across 10 write, erase, and
  controller fault types with full SHA-256 validation enabled in
  bootutil_img_validate. Verified quick sweep runs 30 points in 1150.9s and
  finds 7 issue points and 7 bricks: 6 at write index 11907 at address
  0x0000D860 under bit_corruption, silent_write_failure, driver_error,
  write_disturb, wear_leveling_corruption, and write_rejection when corrupted
  primary-slot payload bytes fail bootutil_img_validate on reboot, plus 1 at
  write index 23814 at address 0x00081FE0 under driver_error when
  boot_write_image_ok receives a non-zero flash_area_write return code and
  aborts Phase 1. Kept out of self_test because execute-only flash sweeps
  exceed 300s wall time.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
pre_boot_state:
  - { address: 0x00081FF0, u32: 0xF395C277 }
  - { address: 0x00081FF4, u32: 0x7FEFD260 }
  - { address: 0x00081FF8, u32: 0x0F505235 }
  - { address: 0x00081FFC, u32: 0x8079B62C }
  - { address: 0x00081FE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000001
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "60.0"
  max_step_limit: 400000000
  fault_types:
    - power_loss
    - interrupted_erase
    - bit_corruption
    - silent_write_failure
    - driver_error
    - rc_injection
    - write_disturb
    - write_rejection
    - multi_sector_atomicity
    - wear_leveling_corruption
expect:
  should_find_issues: true
skip_self_test: true
