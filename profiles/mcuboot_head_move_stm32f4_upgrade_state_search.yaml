schema_version: 1
name: mcuboot_head_move_stm32f4_upgrade_state_search
description: >
  MCUboot HEAD swap-move upgrade on STM32F4 (nucleo_f429zi) with recovery-state
  search across write and erase cuts, mixed torn-word outcomes, and live
  cross-checks.

platform: platforms/stm32f4.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_stm32f4.elf
  entry: 0x08000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08020000, size: 0x60000 }
    staging: { base: 0x08080000, size: 0x60000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_stm32f4_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_move_stm32f4_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: image_header
  marker_address: 0x08020014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  include_erase_fault_points: true
  torn_word: [fixed, untouched, programmed, { partial_bits: 3 }]
  torn_word_seed: 20261127
  fault_types: [power_loss]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  calibration_stop:
    success_criteria: true
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  phase2_fault:
    enabled: true
    first_fault_types: [power_loss, interrupted_erase]
    fault_types: [power_loss, interrupted_erase]
    state_search:
      enabled: true
      max_cuts: 2
      max_new_states: 48
      max_wall_time_s: 180
      address_ranges:
        - { start: 0x08020000, end: 0x080203FF }
        - { start: 0x0807E000, end: 0x0807FFFF }
        - { start: 0x08080000, end: 0x080803FF }
        - { start: 0x080DE000, end: 0x080DFFFF }
      cross_check_every: 4
skip_self_test: true
expect:
  should_find_issues: false
