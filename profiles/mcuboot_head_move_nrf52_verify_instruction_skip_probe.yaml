schema_version: 1
name: mcuboot_head_move_nrf52_verify_instruction_skip_probe
description: >
  Instruction-skip with verification bypass probing against MCUboot
  swap-move on nrf52840dk. MCUboot's FIH (fault injection hardening)
  provides defense-in-depth: bootutil_img_validate is the inner hash
  check and boot_validate_slot wraps it with additional validation.
  Most instruction skips should be caught by the outer layer, producing
  defense_in_depth: held classification.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
pre_boot_state:
  - { address: 0x00081FF0, u32: 0xF395C277 }
  - { address: 0x00081FF4, u32: 0x7FEFD260 }
  - { address: 0x00081FF8, u32: 0x0F505235 }
  - { address: 0x00081FFC, u32: 0x8079B62C }
  - { address: 0x00081FE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [instruction_skip]
  instruction_skip_config:
    target_addresses:
      - { symbol: bootutil_img_validate }
    skip_count: 1
  max_writes: auto
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  verification_bypass_probe:
    enabled: true
    probe_functions:
      - symbol: bootutil_img_validate
        expected_success_value: 0
        layer: hash_validation
      - symbol: "boot_validate_slot.isra.3"
        expected_success_value: 0
        layer: slot_validation
skip_self_test: true
expect:
  should_find_issues: false
