schema_version: 1
name: nxboot_style_no_crc
description: >
  Negative control: nxboot-style bootloader with CRC validation disabled.
  Without CRC checks, a corrupted image can pass validation and boot,
  so power-loss during a copy can leave a half-written (corrupted) image
  in the primary slot that the bootloader happily jumps into.
  This SHOULD find issues.
platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_no_crc.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
  image_hash: true
  image_hash_slot: exec
  expected_image: staging
fault_sweep:
  mode: runtime
  run_duration: "0.5"
  max_writes: 2048
expect:
  should_find_issues: true
