schema_version: 1
name: mcuboot_head_move_nrf52_upgrade_multifault_selftest
description: >
  Self-test smoke profile for multi_fault on MCUboot HEAD swap-move upgrade.
  Uses a bounded initial sweep and a small pairwise budget to validate the
  multi-fault planner and sequential reboot execution path.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
update_trigger: auto
# image_hash requires max_writes:auto (full swap during calibration).
# With max_writes:256, use marker to verify the staging image landed in exec.
# staging image has 0x00000101 at offset 0x14; exec base is 0xC000.
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss, swap_progress]
  max_writes: 256
  max_writes_cap: 256
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  multi_fault:
    enabled: true
    strategy: pairwise_interesting
    max_faults_per_run: 2
    max_pairs: 12
    fallback_strategy: boundary_pairs
expect:
  should_find_issues: false
