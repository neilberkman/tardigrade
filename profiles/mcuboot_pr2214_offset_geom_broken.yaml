schema_version: 1
name: mcuboot_pr2214_offset_geom_broken
description: >
  MCUboot swap-offset geometry trigger for PR #2214 (broken commit 429e2fea).
  find_last_idx off-by-one: returns count instead of index. Full-slot staging
  image with CONFIG_MCUBOOT_BOOT_MAX_ALIGN=32 forces
  last_idx >= first_trailer_idx, aborting the upgrade.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2214_offset_geom_broken.elf
  entry: 0x00000000

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }

images:
  exec: results/oss_validation/assets/zephyr_slot0_padded.bin
  staging: results/oss_validation/assets/zephyr_slot1_offset_geom_full.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
  max_align: 32

success_criteria:
  vtor_in_slot: exec
  image_hash: true
  expected_image: staging

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "10.0"
  max_step_limit: 20000000
  fault_types:
    - power_loss
    - interrupted_erase
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

skip_self_test: true
expect:
  # Broken: find_last_idx off-by-one causes last_idx >= first_trailer_idx,
  # aborting the upgrade.  Control run boots the old exec image = wrong_image.
  control_outcome: wrong_image
  should_find_issues: true
