schema_version: 1
name: mcuboot_pr2214_offset_geom_broken
description: >
  MCUboot swap-offset before PR #2214 at 429e2fea on STM32F429 mirrored-bank
  non-uniform sectors: a 0x18000 primary slot at 0x08008000 with two 16 KiB
  sectors and one 64 KiB trailer sector, and a 0x38000 secondary slot at
  0x08108000 with two 16 KiB sectors, one 64 KiB sector, and one 128 KiB
  trailer sector. The staged v2.1.0 image at secondary offset 0x4000 has swap
  size 0x8000, so find_last_idx returns sector count 2 instead of last index 1,
  swap_run logs "Not enough free space to run swap upgrade", and the control
  boot stays on v1.0.0. Issue #18 and docs/mcuboot-pr2214-swap-offset.md record
  the derivation.

platform: platforms/stm32f4.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2214_offset_geom_broken.elf
  entry: 0x08000000
  algorithm: swap-offset

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08008000, size: 0x18000 }
    staging: { base: 0x08108000, size: 0x38000 }

images:
  exec: results/oss_validation/assets/zephyr_head_scratch_stm32f4_pr2206_slot0.bin
  staging: results/oss_validation/assets/zephyr_slot1_offset_geom_full_offsetslot.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
  max_align: 32

success_criteria:
  vtor_in_slot: exec
  marker_address: 0x08008014
  marker_value: 0x00000102

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: 0
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  fault_types: [power_loss]
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

skip_self_test: true
expect:
  mode: exploratory
  control_outcome: wrong_image
  allow_control_only_issues: true
  should_find_issues: true
