schema_version: 1
skip_self_test: true
name: mcuboot_pr2214_offset_geom_fixed
description: >
  MCUboot swap-offset after PR #2214 at 90fd59d2, paired with
  mcuboot_pr2214_offset_geom_broken on the same STM32F429 mirrored-bank
  non-uniform sector layout and the same staged v2.1.0 image with swap size
  0x8000 at secondary offset 0x4000. find_last_idx returns last index 1, which
  is below the first primary trailer sector 2, so the swap runs and the control
  boot hands off to v2.1.0. Issue #18 and docs/mcuboot-pr2214-swap-offset.md
  record the derivation.

platform: platforms/stm32f4.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2214_offset_geom_fixed.elf
  entry: 0x08000000
  algorithm: swap-offset

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08008000, size: 0x18000 }
    staging: { base: 0x08108000, size: 0x38000 }

images:
  exec: results/oss_validation/assets/zephyr_head_scratch_stm32f4_pr2206_slot0.bin
  staging: results/oss_validation/assets/zephyr_slot1_offset_geom_full_offsetslot.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
  max_align: 32

success_criteria:
  vtor_in_slot: exec
  marker_address: 0x08008014
  marker_value: 0x00000102

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  fault_types: [power_loss]
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

expect:
  mode: exploratory
  control_outcome: success
  should_find_issues: false
