schema_version: 1
name: esp_idf_ota_upgrade_security_policy
description: >
  ESP-IDF OTA upgrade with anti-rollback security policy. Validates that
  fault injection cannot cause a downgrade to a firmware version below
  the minimum allowed version.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: examples/esp_idf_ota/esp_idf_ota.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x74000 }
    staging: { base: 0x00080000, size: 0x74000 }
images:
  exec: examples/esp_idf_ota/slot0.bin
  staging: examples/esp_idf_ota/slot1.bin

pre_boot_state:
  # Entry 0 (sector 0 at 0xF8000): ota_seq=1, VALID
  - { address: 0x000F8000, u32: 0x00000001 }  # ota_seq = 1
  - { address: 0x000F8018, u32: 0x00000002 }  # ota_state = VALID
  - { address: 0x000F801C, u32: 0x4743989A }  # CRC-32 of ota_seq=1
  # Entry 1 (sector 1 at 0xF9000): ota_seq=2, NEW
  - { address: 0x000F9000, u32: 0x00000002 }  # ota_seq = 2
  - { address: 0x000F9018, u32: 0x00000000 }  # ota_state = NEW
  - { address: 0x000F901C, u32: 0x55F63774 }  # CRC-32 of ota_seq=2
  # Trigger one-shot copy-on-boot update path (staging -> exec).
  - { address: 0x000FC040, u32: 0x55445021 }

# Anti-rollback requires image_hash to detect old-image-in-exec.
# After upgrade, exec should contain the staging image.
success_criteria:
  vtor_in_slot: any
  image_hash: true
  image_hash_slot: exec
  expected_image: staging

security_policy:
  anti_rollback: true
  minimum_version: 2

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "2.0"
  max_step_limit: 20000000
  fault_types: [power_loss, interrupted_erase]
skip_self_test: true
expect:
  should_find_issues: false
