schema_version: 1
name: nxboot_style_instruction_skip_boot_logic
description: >
  Instruction-skip targeting the main boot decision logic (Reset_Handler).
  This function contains the update/revert/boot decision tree. Skipping
  a single branch instruction could bypass revert after a failed update,
  skip recovery creation, or jump to an unvalidated image. This is the
  highest-value glitch attack surface in nxboot.
platform: platforms/cortex_m0_mapped_faultctrl.repl
flash_backend: faultFlash
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  run_duration: "0.5"
  fault_types: [instruction_skip]
  instruction_skip_config:
    target_addresses:
      - { symbol: Reset_Handler }
    skip_count: 1
expect:
  should_find_issues: false
