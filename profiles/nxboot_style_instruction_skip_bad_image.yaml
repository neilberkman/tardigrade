schema_version: 1
name: nxboot_style_instruction_skip_bad_image
description: >
  Instruction-skip against nxboot-style bootloader with a deliberately
  corrupted update image (bad CRC) in the staging slot. The bootloader
  should reject this image. This profile verifies that no single
  instruction skip on the validation or boot-decision functions can
  cause the bad image to be accepted and booted. Tests the strength
  of CRC-check hardening against glitch attacks.
platform: platforms/cortex_m0_mapped_faultctrl.repl
flash_backend: faultFlash
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update_bad_crc.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  run_duration: "0.5"
  phase1_time_slice: "0.10"
  fault_types: [instruction_skip]
  instruction_skip_config:
    target_addresses:
      - { symbol: validate_image }
      - { symbol: copy_partition }
    skip_count: 1
skip_self_test: true
expect:
  should_find_issues: false
