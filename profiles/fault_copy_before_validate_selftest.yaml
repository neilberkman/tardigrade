schema_version: 1
name: fault_copy_before_validate_selftest
description: >-
  Self-test smoke profile for copy-before-validate. Uses a bounded write
  window so generic self-test still exercises the vulnerable copy-in-place
  path without sweeping the full 28k-point coverage profile.

platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/vulnerable_ota/firmware.elf
  entry: 0x10000000

memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 8
  slots:
    exec:    { base: 0x10000000, size: 0x38000 }
    staging: { base: 0x10038000, size: 0x38000 }

images:
  staging: examples/vulnerable_ota/firmware.bin

success_criteria:
  vtor_in_slot: exec

fault_sweep:
  mode: runtime
  max_writes: 512
  max_writes_cap: 4096
  run_duration: "0.01"

expect:
  should_find_issues: true
