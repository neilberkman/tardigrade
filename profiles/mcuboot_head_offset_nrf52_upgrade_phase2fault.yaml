schema_version: 1
name: mcuboot_head_offset_nrf52_upgrade_phase2fault
description: >
  MCUboot HEAD swap-offset upgrade on nrf52840dk with phase2_fault enabled.
  Second fault injected during recovery boot after initial upgrade fault,
  testing whether the offset-mode resume logic is power-loss safe.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_offset_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_offset_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_offset_nrf52_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss, swap_progress]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  phase2_fault:
    enabled: true
    fault_types: [power_loss]
    max_points: 12
skip_self_test: true
expect:
  should_find_issues: false
