schema_version: 1
name: fault_residual_image_erased
description: >-
  Direct-XIP bootloader that erases the full slot before writing the new
  image.  Even though a prior (larger) image existed, the erasure eliminates
  stale tail bytes.  The max_reset_vector_offset criterion should PASS
  because the slot contains only the authenticated image (no residual data).
  This is the "safe" counterpart to fault_residual_image_naive.

platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/vulnerable_ota/firmware.elf
  entry: 0x10000000

memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 8
  slots:
    exec:    { base: 0x10000000, size: 0x38000 }
    staging: { base: 0x10038000, size: 0x38000 }

images:
  staging: examples/vulnerable_ota/firmware.bin

residual_image:
  slot: staging
  prior_image: examples/test_image.bin
  fill_pattern: 0x00

success_criteria:
  vtor_in_slot: exec
  max_reset_vector_offset: 248

fault_sweep:
  mode: runtime
  max_writes: 28672
  max_writes_cap: 1000
  run_duration: "0.01"

expect:
  should_find_issues: true

skip_self_test: true
