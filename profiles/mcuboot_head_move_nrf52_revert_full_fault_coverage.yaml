schema_version: 1
name: mcuboot_head_move_nrf52_revert_full_fault_coverage
description: "Full NVM fault coverage: exercises all general fault types the engine\
  \ supports. Zero-day hunt: MCUboot HEAD swap-move revert on nrf52840dk. Default\
  \ geometry (448KB slots). Images swapped, upgrade unconfirmed \u2014 MCUboot should\
  \ revert to original. Different-sized images.\n"
platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0
memory:
  sram:
    start: 536870912
    end: 537133056
  write_granularity: 4
  slots:
    exec:
      base: 49152
      size: 483328
    staging:
      base: 532480
      size: 483328
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
pre_boot_state:
- address: 532464
  u32: 4086678135
- address: 532468
  u32: 2146423392
- address: 532472
  u32: 256922165
- address: 532476
  u32: 2155460140
- address: 532448
  u32: 1
success_criteria:
  vtor_in_slot: exec
  marker_address: 49172
  marker_value: 1
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: '20.0'
  max_step_limit: 200000000
  sweep_hash_bypass_symbols:
  - bootutil_img_validate
  fault_types:
  - power_loss
  - interrupted_erase
  - bit_corruption
  - silent_write_failure
  - driver_error
  - rc_injection
  - write_disturb
  - write_rejection
  - multi_sector_atomicity
  - wear_leveling_corruption
  - read_bit_flip
expect:
  should_find_issues: false
skip_self_test: true
