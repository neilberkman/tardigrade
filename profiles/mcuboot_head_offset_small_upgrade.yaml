schema_version: 1
name: mcuboot_head_offset_small_upgrade
description: >
  Zero-day hunt: MCUboot HEAD swap-offset upgrade with small 128KB slots
  on nrf52840dk. Tests new swap-offset algorithm with constrained geometry.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_offset_small.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x20000 }
    staging: { base: 0x0002C000, size: 0x20000 }
images:
  exec: results/oss_validation/assets/zephyr_head_offset_small_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_offset_small_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss, swap_progress]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
