base_profile: mcuboot_head_move_nrf52_upgrade.yaml

schema_version: 1
name: mcuboot_head_move_nrf52_writeback
description: >
  MCUboot current-HEAD swap-move upgrade on nrf52840dk with a writeback
  durability model. Inherits the swap-move geometry and artifacts; only
  power-loss cutpoints are selected.
update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss]
  durability_model: writeback
  writeback:
    buffer_capacity: auto
    erase_flushes_domain: false
expect:
  should_find_issues: true
skip_self_test: true
