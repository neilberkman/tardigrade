schema_version: 1
name: security_toctou_with_protection
description: >-
  TOCTOU (time-of-check-to-time-of-use) fault scenario WITH protection
  declared. Models the same attack vector as the unprotected variant:
  bit corruption injected during the copy/swap operation between
  validation and execution. A bootloader with TOCTOU protection
  re-validates (e.g., re-hashes) the image after copying it to the
  exec slot, detecting any corruption introduced during the copy.
  The security_policy.toctou_protection flag declares this expectation.
  Fault injection tests whether the re-validation is itself resilient
  to interruption.

platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/vulnerable_ota/firmware.elf
  entry: 0x10000000

memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 8
  slots:
    exec:    { base: 0x10000000, size: 0x38000 }
    staging: { base: 0x10038000, size: 0x38000 }

images:
  staging: examples/vulnerable_ota/firmware.bin

security_policy:
  anti_rollback: false
  toctou_protection: true

# Bit corruption during copy: same attack vector, but the bootloader
# should detect it via post-copy re-validation.
fault_sweep:
  mode: runtime
  max_writes: 28672
  max_writes_cap: 100000
  run_duration: "0.01"
  fault_types: [bit_corruption]

success_criteria:
  vtor_in_slot: exec

# With TOCTOU protection, the bootloader should detect corrupted
# copies and refuse to boot them. Issues here mean the re-validation
# itself can be defeated.
expect:
  should_find_issues: true
