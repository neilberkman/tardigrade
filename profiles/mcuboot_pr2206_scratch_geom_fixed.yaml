schema_version: 1
name: mcuboot_pr2206_scratch_geom_fixed
description: >
  MCUboot swap-scratch geometry trigger for PR #2206 (fixed commit 08985c96).
  Companion profile for the verified 0x7C80 align-32 STM32F4 boundary image.
  The fixed revision rejects the boundary image and converges to no_boot
  across repeated boots instead of exhibiting the broken wrong_image path.

platform: platforms/stm32f4.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2206_scratch_geom_fixed.elf
  entry: 0x08000000

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08008000, size: 0x18000 }
    staging: { base: 0x08108000, size: 0x18000 }

images:
  exec: results/oss_validation/assets/zephyr_head_scratch_stm32f4_pr2206_slot0.bin
  staging: results/oss_validation/assets/zephyr_slot1_scratch_geom_pr2206_boundary.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
  max_align: 32

success_criteria: {}

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  boot_cycles: 3
  max_writes: 1
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 20000000
  fault_types:
    - power_loss
    - interrupted_erase

semantic_assertions:
  control:
    multi_boot_analysis.status: converged
    multi_boot_analysis.final_outcome: no_boot

invariants:
  - multi_boot_converges

expect:
  control_outcome: no_boot
  should_find_issues: false
