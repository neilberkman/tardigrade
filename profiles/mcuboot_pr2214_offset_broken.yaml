schema_version: 1
name: mcuboot_pr2214_offset_broken
description: >
  MCUboot swap-offset BEFORE PR #2214 find_last_idx fix (broken commit 429e2fea).
  Seeded STM32F4 resume-state profile for an interrupted swap-offset upgrade.
  The broken revision resumes with the wrong last-sector index and converges
  to no_boot instead of completing the staged update.

platform: platforms/stm32f4.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2214_offset_broken.elf
  entry: 0x08000000

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0800C000, size: 0x76000 }
    staging: { base: 0x08082000, size: 0x76000 }

images:
  exec: results/oss_validation/assets/zephyr_head_offset_stm32f4_slot0.bin
  staging: results/oss_validation/assets/zephyr_slot1_offset_geom_full_offsetslot.bin

pre_boot_state:
  - { address: 0x08081FF0, u32: 0x676523FB }
  - { address: 0x08081FF4, u32: 0x27388D84 }
  - { address: 0x08081FF8, u32: 0xF6CB3E6C }
  - { address: 0x08081FFC, u32: 0xC702C279 }
  - { address: 0x08081F80, u32: 0x00000002 }
  - { address: 0x08081F60, u32: 20532 }
  - { address: 0x08081BD4, u32: 0x00000001 }

success_criteria:
  vtor_in_slot: exec
  # A successful handoff must be the staged v2.1.0 image, not the old v1
  # image already present in exec.  The offset payload's header is at the
  # executable slot base and carries version 0x00000102 at +0x14.
  marker_address: 0x0800C014
  marker_value: 0x00000102

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  boot_cycles: 3
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "10.0"
  max_step_limit: 20000000
  fault_types: [power_loss]

semantic_assertions:
  control:
    multi_boot_analysis.status: converged
    multi_boot_analysis.final_outcome: no_boot

invariants:
  - multi_boot_converges

expect:
  control_outcome: no_boot
  allow_control_only_issues: true
  should_find_issues: true
