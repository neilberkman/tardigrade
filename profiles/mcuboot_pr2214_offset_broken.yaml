schema_version: 1
name: mcuboot_pr2214_offset_broken
description: >
  MCUboot swap-offset BEFORE PR #2214 find_last_idx fix (broken commit 429e2fea).
  find_last_idx returns count instead of index; with a max-size staging image
  this should trigger "Not enough free space" and wrongly abort the upgrade.
  The current nRF52 max-size image still does not hit the boundary honestly;
  tracked in issue #18.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2214_offset_broken.elf
  entry: 0x00000000

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }

images:
  exec: results/oss_validation/assets/zephyr_slot0_padded.bin
  staging: results/oss_validation/assets/zephyr_slot1_max.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging

success_criteria:
  vtor_in_slot: exec
  image_hash: true
  image_hash_slot: exec
  expected_image: staging

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  quick_use_heuristic: true
  max_heuristic_points: 64
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "2.0"
  max_step_limit: 20000000
  fault_types:
    - power_loss
    - interrupted_erase
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

skip_self_test: true
expect:
  # Target behavior once the asset trigger is corrected: the broken commit
  # should refuse the upgrade and keep booting the old exec image.
  control_outcome: wrong_image
  should_find_issues: true
