schema_version: 1
name: mcuboot_pr2214_offset_broken
description: >
  MCUboot swap-offset before PR #2214 at 429e2fea. nRF52840 layout with
  4 KiB sectors: a 0x75000 primary slot at 0xC000 and a 0x76000 secondary
  slot at 0x81000, one sector larger as swap-offset expects. The staged
  v1.2.0 image has swap size 0x74000, so it ends exactly where the primary
  trailer sector begins. find_last_idx returns the sector count 116 instead
  of the last index 115, swap_run logs "Not enough free space to run swap
  upgrade", and the control boot stays on v1.0.0. Issue #18 and
  docs/mcuboot-pr2214-swap-offset.md record the derivation.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2214_offset_nrf52_broken.elf
  entry: 0x00000000
  algorithm: swap-offset

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x75000 }
    staging: { base: 0x00081000, size: 0x76000 }

# The staging file starts with one erased 4 KiB sector, so the image header
# sits at secondary-slot offset 0x1000 where swap-offset expects it.
images:
  exec: results/oss_validation/assets/zephyr_slot0_padded.bin
  staging: results/oss_validation/assets/zephyr_slot1_pr2214_swap_0x74000_offsetslot.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging

success_criteria:
  vtor_in_slot: exec
  # Header version of the staged image: 1.2.0 at exec base + 0x14.
  marker_address: 0x0000C014
  marker_value: 0x00000201

# 429e2fea refuses the upgrade before swap_run moves any image data. Its only
# flash write is copy_done at 0x80FE0 in the primary trailer, and a power
# loss there also boots v1.0.0. The control boot is the regression signal,
# so zero fault points makes this an intentional control-only campaign.
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: 0
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  fault_types: [power_loss]
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

skip_self_test: true
expect:
  control_outcome: wrong_image
  allow_control_only_issues: true
  should_find_issues: true
