schema_version: 1
name: nxboot_style_update_phase2fault
skip_self_test: true
description: >
  nxboot-style update with phase2 fault injection. Injects a
  second power-loss fault during the recovery boot after an
  initial update fault to validate nested recovery.
platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
  image_hash: true
  image_hash_slot: exec
  expected_image: staging
fault_sweep:
  mode: runtime
  run_duration: "0.5"
  max_writes: 2048
  phase2_fault:
    enabled: true
    fault_types: [power_loss]
    max_points: 12
expect:
  should_find_issues: false
