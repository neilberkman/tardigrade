schema_version: 1
name: mcuboot_head_scratch_nrf52_upgrade_extended
description: >
  Zero-day hunt: MCUboot HEAD swap-scratch upgrade on nrf52840dk.
  Extended fault coverage: power-loss + interrupted erase + bit corruption.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_scratch_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x6E000 }
    staging: { base: 0x0007A000, size: 0x6E000 }
images:
  exec: results/oss_validation/assets/zephyr_head_scratch_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_scratch_nrf52_slot1.bin
update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
success_criteria:
  vtor_in_slot: exec
  image_hash: true
  expected_image: staging
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: ["power_loss", "interrupted_erase", "bit_corruption"]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: false
