schema_version: 1
name: mcuboot_head_offset_nrf52_upgrade_state_search
description: >
  MCUboot HEAD swap-offset upgrade on nRF52840 with recovery-state search
  across write and erase cuts, mixed torn-word outcomes, and live cross-checks.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_offset_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_offset_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_offset_nrf52_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  include_erase_fault_points: true
  torn_word: [fixed, untouched, programmed, { partial_bits: 3 }]
  torn_word_seed: 20261127
  fault_types: [power_loss]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  calibration_stop:
    success_criteria: true
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  phase2_fault:
    enabled: true
    first_fault_types: [power_loss, interrupted_erase]
    fault_types: [power_loss, interrupted_erase]
    state_search:
      enabled: true
      max_cuts: 3
      max_new_states: 48
      max_wall_time_s: 180
      address_ranges:
        - { start: 0x0000C000, end: 0x0000C3FF }
        - { start: 0x00080000, end: 0x00081FFF }
        - { start: 0x00082000, end: 0x000823FF }
        - { start: 0x000F6000, end: 0x000F7FFF }
      cross_check_every: 4
skip_self_test: true
expect:
  should_find_issues: false
