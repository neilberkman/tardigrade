schema_version: 1
name: mcuboot_head_offset_stm32f4_fast_upgrade
description: >
  Zero-day hunt: MCUboot HEAD swap-offset upgrade on STM32F4 fast platform.
  Non-uniform flash sectors (16KB/64KB/128KB). Tests new swap-offset
  algorithm on non-uniform geometry.

platform: platforms/stm32f4_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_offset_stm32f4.elf
  entry: 0x08000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08020000, size: 0x60000 }
    staging: { base: 0x08080000, size: 0x60000 }
images:
  exec: results/oss_validation/assets/zephyr_head_offset_stm32f4_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_offset_stm32f4_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x08020014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss, swap_progress]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: false
