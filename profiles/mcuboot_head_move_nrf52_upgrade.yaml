schema_version: 1
skip_self_test: true
name: mcuboot_head_move_nrf52_upgrade
description: >
  Zero-day hunt: MCUboot HEAD swap-move upgrade on nrf52840dk.
  Default geometry (448KB slots). Different-sized images to expose
  geometry-dependent bugs.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000101
state_probe:
  script: targets/mcuboot/probe.py
  required_paths:
    - semantic_state.target
    - semantic_state.slots.exec.magic_state
    - semantic_state.slots.staging.magic_state
    - semantic_state.flags.any_partial_magic
semantic_assertions:
  control:
    semantic_state.target: mcuboot
    semantic_state.flags.any_partial_magic: false
invariant_providers:
  - targets/mcuboot/invariants.py
invariants:
  - mcuboot_no_partial_magic
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  fault_types: [power_loss, swap_progress]
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
