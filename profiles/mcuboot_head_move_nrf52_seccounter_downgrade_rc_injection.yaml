schema_version: 1
name: mcuboot_head_move_nrf52_seccounter_downgrade_rc_injection
description: >
  Retroactive validation negative control for the nRF52 security-counter
  downgrade scenario. rc_injection is kept here as a skeptic-stage check:
  the downgrade should still be rejected, and no reportable issue should
  survive validation.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52_seccounter.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x6E000 }
    staging: { base: 0x0007A000, size: 0x6E000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_seccounter_v2.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_seccounter_v1.bin
update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
success_criteria:
  vtor_in_slot: exec
  image_hash: true
  expected_image: exec
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: ["rc_injection", "power_loss"]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "60.0"
  max_step_limit: 400000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  control_outcome: success
  should_find_issues: false
