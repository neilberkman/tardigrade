schema_version: 1
name: mcuboot_head_scratch_stm32f4_fast_upgrade
description: >
  Zero-day hunt: MCUboot HEAD swap-scratch upgrade on nucleo_f429zi.
  Mirrored-bank non-uniform sectors, 224KB slots, 128KB scratch. Combines
  scratch algorithm with sector-aligned geometry for maximum bug surface.

platform: platforms/stm32f4_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_scratch_stm32f4.elf
  entry: 0x08000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  erase_regions:
    - { base: 0x08000000, size: 0x10000, sector_size: 0x4000 }
    - { base: 0x08010000, size: 0x10000, sector_size: 0x10000 }
    - { base: 0x08020000, size: 0xE0000, sector_size: 0x20000 }
    - { base: 0x08100000, size: 0x10000, sector_size: 0x4000 }
    - { base: 0x08110000, size: 0x10000, sector_size: 0x10000 }
    - { base: 0x08120000, size: 0xE0000, sector_size: 0x20000 }
  postmortem_partitions:
    - { name: scratch, base: 0x08040000, size: 0x20000 }
  slots:
    exec: { base: 0x08008000, size: 0x38000 }
    staging: { base: 0x08108000, size: 0x38000 }
images:
  exec: results/oss_validation/assets/zephyr_head_scratch_stm32f4_mirrored_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_scratch_stm32f4_mirrored_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x08008014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss, swap_progress]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: false
skip_self_test: true
