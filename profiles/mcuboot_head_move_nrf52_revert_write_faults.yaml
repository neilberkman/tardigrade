schema_version: 1
name: mcuboot_head_move_nrf52_revert_write_faults
description: >
  Zero-day hunt: MCUboot HEAD swap-move revert on nrf52840dk.
  WRITE-CLASS faults only: write_rejection, silent_write_failure,
  write_disturb, wear_leveling_corruption. These are the fault types
  where the flash driver returns rc=0 but data is not correctly stored.
  This is the empirical proof for Issue B (no write verification).

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
pre_boot_state:
  - { address: 0x00081FF0, u32: 0xF395C277 }
  - { address: 0x00081FF4, u32: 0x7FEFD260 }
  - { address: 0x00081FF8, u32: 0x0F505235 }
  - { address: 0x00081FFC, u32: 0x8079B62C }
  - { address: 0x00081FE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000001
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: ["write_rejection", "silent_write_failure", "write_disturb", "wear_leveling_corruption"]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
