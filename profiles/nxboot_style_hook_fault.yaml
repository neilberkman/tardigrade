schema_version: 1
name: nxboot_style_hook_fault
description: >
  Hook-fault injection during nxboot confirm operation. Tests what
  happens when the application's NVM write to confirm the primary
  image is interrupted (power_loss), corrupted (bit_corruption), or
  silently dropped (command_drop). The bootloader should handle all
  three gracefully — either the image is confirmed or it reverts.
platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
  staging: examples/nxboot_style/nxboot_update.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
fault_sweep:
  mode: runtime
  run_duration: "0.5"
  max_writes: 2048
  boot_cycles: 3
  boot_cycle_hook: examples/nxboot_style/hooks/confirm_nxboot.py
  hook_fault:
    enabled: true
    fault_types: [power_loss, bit_corruption, command_drop]
    max_points: 20
expect:
  # hook_fault finds confirm-write interruptions that cause bricks
  should_find_issues: true
