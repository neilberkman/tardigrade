schema_version: 1
name: mcuboot_head_move_nrf52_upgrade_verify_corrupt_staging_candidates
description: >
  Single-glitch instruction-skip probe against MCUboot FIH-hardened hash
  verification with a corrupted staging image. MCUboot HEAD's FIH double-check
  pattern resists single-instruction skip at the cbnz/cmp bypass points.
  This profile validates that resilience — no bypass expected.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot1_verify_corrupt.bin
update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
success_criteria:
  vtor_in_slot: exec
  image_hash: true
  expected_image: staging
expect:
  should_find_issues: false
  control_outcome: wrong_image
  allow_control_only_issues: true
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [instruction_skip]
  instruction_skip_config:
    target_addresses:
      # b.n 524 — reject branch after FIH cmp. Single skip falls through
      # to cmp r4,#1 (r4=1) but FIH counter at 0x778 still catches it.
      - { start: 0x000005CE, end: 0x000005D0 }
      # cbnz r0 — boot_validate_slot return check. Single skip falls
      # through but FIH counter comparison at 0x778 still rejects.
      - { start: 0x0000076E, end: 0x00000770 }
    skip_count: 1
  verification_probes:
    - symbol: bootutil_img_validate
      return_register: r0
      success_value: 0
      label: hash_validation
    - symbol: "boot_validate_slot.isra.3"
      return_register: r0
      success_value: 0
      label: slot_validation
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
