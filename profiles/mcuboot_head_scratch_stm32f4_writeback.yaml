base_profile: mcuboot_head_scratch_stm32f4_upgrade.yaml

schema_version: 1
name: mcuboot_head_scratch_stm32f4_writeback
description: >
  MCUboot current-HEAD scratch upgrade on nucleo_f429zi with a writeback
  durability model. Inherits the established scratch geometry and artifacts;
  only power-loss cutpoints are selected.
success_criteria:
  # The STM32 application handoff does not leave VTOR in the executable slot.
  # Observe execution in the slot directly, including transient execution
  # retained by the runtime reset-handler hook.
  vtor_in_slot:
  vector_table_offset: 0x400
  pc_in_slot: exec
  # STM32 maps flash at both 0x00000000 and 0x08000000. Renode reports the
  # reset-handler hook through the low alias for this platform.
  pc_hook_alias_offsets: [-0x08000000]
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: [power_loss]
  durability_model: writeback
  writeback:
    buffer_capacity: auto
    erase_flushes_domain: false
skip_self_test: true
