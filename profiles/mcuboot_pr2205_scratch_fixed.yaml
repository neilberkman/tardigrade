schema_version: 1
name: mcuboot_pr2205_scratch_fixed
description: >
  MCUboot swap-scratch AFTER PR #2205 geometry fix (fixed commit bbd0ee1e).
  Companion STM32F4 non-uniform geometry profile for the broken revision.
  On the same 128 KB primary / mixed-size secondary layout, the fixed commit
  completes the upgrade and boots the staging image.

platform: platforms/stm32f4.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2205_scratch_fixed.elf
  entry: 0x08000000

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x08020000, size: 0x20000 }
    staging: { base: 0x08008000, size: 0x18000 }

images:
  exec: results/oss_validation/assets/zephyr_head_scratch_stm32f4_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_scratch_stm32f4_slot1.bin

update_trigger:
  type: mcuboot_trailer_magic
  slot: staging

success_criteria:
  vtor_in_slot: exec
  image_hash: true
  image_hash_slot: exec
  expected_image: staging

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  quick_use_heuristic: true
  max_heuristic_points: 64
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "2.0"
  max_step_limit: 20000000
  fault_types:
    - power_loss
    - interrupted_erase
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

skip_self_test: true
expect:
  control_outcome: success
  should_find_issues: false
