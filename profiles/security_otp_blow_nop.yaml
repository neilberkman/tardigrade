schema_version: 1
name: security_otp_blow_nop
description: >-
  Test bootloader behavior when an OTP fuse blow physically fails to
  take effect.  The programming instruction executes but the fuse
  state does not change.  Catches firmware that retries fuse blows
  in an unbounded loop without checking for forward progress, which
  leads to a permanent device brick.

platform: platforms/cortex_m0_otp.repl
flash_backend: nvm_ctrl
otp_peripheral: otp
bootloader:
  elf: examples/vulnerable_ota/firmware.elf
  entry: 0x10000000

memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 8
  slots:
    exec:    { base: 0x10000000, size: 0x38000 }
    staging: { base: 0x10038000, size: 0x38000 }

images:
  staging: examples/vulnerable_ota/firmware.bin

security_policy:
  anti_rollback: true
  minimum_version: 2

success_criteria:
  vtor_in_slot: exec

fault_sweep:
  mode: runtime
  max_writes: 28672
  # Explicit operation bound keeps this OTP-only campaign independent of
  # NVM write-trace calibration.
  max_otp_blows: 5
  max_writes_cap: 100000
  run_duration: "0.01"
  fault_types:
    - otp_blow_nop

expect:
  should_find_issues: false
