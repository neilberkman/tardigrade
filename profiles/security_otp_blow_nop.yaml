schema_version: 1
name: security_otp_blow_nop
description: >-
  Legacy configuration example for the otp_blow_nop fault model against the
  generic OTA memory layout.  This fixture does not issue OTP writes; use
  firmware_otp_blow_nop_harness for an executable end-to-end campaign.

platform: platforms/cortex_m0_otp.repl
flash_backend: nvm_ctrl
otp_peripheral: otp
bootloader:
  elf: examples/vulnerable_ota/firmware.elf
  entry: 0x10000000

memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 8
  slots:
    exec:    { base: 0x10000000, size: 0x38000 }
    staging: { base: 0x10038000, size: 0x38000 }

images:
  staging: examples/vulnerable_ota/firmware.bin

security_policy:
  anti_rollback: true
  minimum_version: 2

success_criteria:
  vtor_in_slot: exec

fault_sweep:
  mode: runtime
  max_writes: 28672
  # Explicit operation bound keeps this OTP-only campaign independent of
  # NVM write-trace calibration.
  max_otp_blows: 5
  max_writes_cap: 100000
  run_duration: "0.01"
  fault_types:
    - otp_blow_nop

expect:
  should_find_issues: false

# Executable CI coverage lives in firmware_otp_blow_nop_harness.
skip_self_test: true
