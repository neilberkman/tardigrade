schema_version: 1
name: mcuboot_head_scratch_stm32f4_upgrade
description: >
  Zero-day hunt: MCUboot HEAD swap-scratch upgrade on nucleo_f429zi.
  Non-uniform sectors, 352KB slots, 64KB scratch. Combines scratch
  algorithm with non-uniform geometry for maximum bug surface.

platform: platforms/stm32f4.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_scratch_stm32f4.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x00020000, size: 0x58000 }
    staging: { base: 0x00078000, size: 0x58000 }
images:
  exec: results/oss_validation/assets/zephyr_head_scratch_stm32f4_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_scratch_stm32f4_slot1.bin
update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
success_criteria:
  vtor_in_slot: exec
  image_hash: true
  expected_image: staging
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "2.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: false
