schema_version: 1
name: mcuboot_pr3011_offset_fixed
description: >
  MCUboot PR #3011 swap-using-offset with assertions enabled. Uses the exact
  two-cut #3010 regression pair that halts v2.5.0 after the third boot cannot
  read the half-swapped primary image size.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr3011_offset_fixed.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_pr3011_offset_6k_slot1.bin
  staging: results/oss_validation/assets/zephyr_pr3011_offset_6k_slot0.bin
pre_boot_state:
  - { address: 0x00081FF0, u32: 0xF395C277 }
  - { address: 0x00081FF4, u32: 0x7FEFD260 }
  - { address: 0x00081FF8, u32: 0x0F505235 }
  - { address: 0x00081FFC, u32: 0x8079B62C }
  - { address: 0x00081FE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000001
  approved_image_running:
    slot: exec
    images: [staging]
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  phase2_time_slice: "0.005"
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  phase2_fault:
    enabled: true
    fault_types: [interrupted_erase]
    pairs:
      - [484, 3]
skip_self_test: true
expect:
  should_find_issues: false
