schema_version: 1
name: rustboot_nrf52840_update
description: >
  rustBoot nRF52840 swap-scratch update scenario. Boot partition has v1
  firmware, update partition has v2. UPDATE trailer marked as Updating
  (0x70) to trigger swap. The current nRF52 fast backend can observe page
  erases for rustBoot reliably, but rustBoot's NVMC HAL does not expose
  per-word write counts in the way the fast write tracer expects, so this
  profile currently targets interrupted-erase faults across the swap path.
  The checked-in asset is intentionally a bug-finding campaign: quick
  erase-fault sampling already reproduces a brick during swap.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/rustboot_nrf52840.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0002F000, size: 0x28000 }
    staging: { base: 0x00058000, size: 0x28000 }
# Boot partition (exec) has v1 signed firmware.
# Update partition (staging) has v2 signed firmware.
images:
  exec: results/oss_validation/assets/rustboot_boot_v1.bin
  staging: results/oss_validation/assets/rustboot_update_v2.bin
# Trigger update: write UPDATE trailer state = Updating (0x70)
# UPDATE trailer at UPDATE_PARTITION_ADDRESS + PARTITION_SIZE = 0x80000
# Trailer layout (from end): magic "BOOT" at -4, state byte at -5.
# State byte at 0x7FFFB. Pack as u32 at 0x7FFF8: [FF,FF,FF,70] = 0x70FFFFFF
# Magic "BOOT" (0x544F4F42 LE) at 0x7FFFC.
pre_boot_state:
  - { address: 0x0007FFF8, u32: 0x70FFFFFF }
  - { address: 0x0007FFFC, u32: 0x544F4F42 }
success_criteria:
  vtor_in_slot: exec
  image_hash: true
  image_hash_slot: exec
  expected_image: staging
state_probe:
  script: targets/rustboot/probe.py
  required_paths:
    - semantic_state.target
    - semantic_state.boot.magic_valid
    - semantic_state.boot.state
    - semantic_state.flags.boot_flags_monotonic
    - semantic_state.flags.update_flags_monotonic
semantic_assertions:
  control:
    semantic_state.target: rustboot
    semantic_state.boot.magic_valid: true
    semantic_state.boot.state: testing
    semantic_state.flags.boot_flags_monotonic: true
    semantic_state.flags.update_flags_monotonic: true
invariant_providers:
  - targets/rustboot/invariants.py
invariants:
  - rustboot_boot_not_empty
  - rustboot_swap_flags_consistent
  - rustboot_no_packed_flag_corruption
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  # rustBoot's nRF52840 HAL keeps NVMC in WEN across flash writes, so the
  # fast nRF52 backend cannot derive a reliable write index trace yet.
  # Page-erase tracking still works, so start with erase-fault coverage.
  fault_types: [interrupted_erase]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
skip_self_test: true
expect:
  should_find_issues: true
