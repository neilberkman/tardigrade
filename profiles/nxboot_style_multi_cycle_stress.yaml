schema_version: 1
name: nxboot_style_multi_cycle_stress
description: >
  Multi-cycle OTA stress test for nxboot-style bootloader.
  Phase 1 (clean): v1 in exec, v2 in staging. Bootloader copies v2 to
  primary, confirm hook marks it valid. Phase 2 (faulted): v3 loaded
  into staging. Bootloader begins copying v3 to primary with power-loss
  fault injection. Tests that post-confirm state is clean enough for a
  second update, and that interrupted second update reverts to v2.
platform: platforms/cortex_m0_nvm.repl
flash_backend: nvm_ctrl
bootloader:
  elf: examples/nxboot_style/bootloader_nxboot_none.elf
  entry: 0x10000000
memory:
  sram: { start: 0x20000000, end: 0x20020000 }
  write_granularity: 4
  slots:
    exec: { base: 0x10002000, size: 0x23000 }
    staging: { base: 0x10025000, size: 0x23000 }
images:
  exec: examples/nxboot_style/nxboot_primary.bin
success_criteria:
  vtor_in_slot: exec
  vector_table_offset: 0x200
  image_hash: true
  image_hash_slot: exec
  expected_image: staging
fault_sweep:
  mode: runtime
  run_duration: "0.5"
  max_writes: 2048
  fault_types: [power_loss]
update_sequence:
  - name: initial_upgrade_and_confirm
    description: "v1 -> v2 upgrade, then confirm"
    images:
      staging: examples/nxboot_style/nxboot_update.bin
    success_criteria:
      vtor_in_slot: exec
      vector_table_offset: 0x200
      image_hash: true
      image_hash_slot: exec
      expected_image: staging
    boot_cycles: 2
    boot_cycle_hook: examples/nxboot_style/hooks/confirm_nxboot.py
    fault_injection: false

  - name: second_upgrade_faulted
    description: "v2 -> v3 upgrade with power-loss during copy"
    images:
      staging: examples/nxboot_style/nxboot_v3.bin
    success_criteria:
      vtor_in_slot: exec
      vector_table_offset: 0x200
    boot_cycles: 3
    fault_injection: true
    fault_types: [power_loss]

expect:
  should_find_issues: false
