schema_version: 1
name: mcuboot_head_move_nrf52_upgrade_extended_selftest
description: >
  Self-test smoke profile for MCUboot HEAD swap-move upgrade with extended
  fault coverage on nrf52840dk. Keeps the generic discovery path and fault
  mix, but bounds the execute sweep for routine self-test runtime.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
update_trigger: auto
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000101
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: ["power_loss", "interrupted_erase", "bit_corruption", "swap_progress"]
  max_writes: 128
  max_writes_cap: 256
  fault_step: 32
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
