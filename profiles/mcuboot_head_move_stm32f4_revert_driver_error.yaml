schema_version: 1
name: mcuboot_head_move_stm32f4_revert_driver_error
description: >
  ISSUE A PROOF: MCUboot HEAD swap-move revert on nucleo_f429zi with
  driver_error fault type. STM32F4 flash controller sets PGPERR in SR,
  Zephyr driver reads SR and returns -EIO, MCUboot's compiled-out
  assert(rc==0) ignores it, execution continues with torn trailer.

platform: platforms/stm32f4_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_stm32f4.elf
  entry: 0x08000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  page_size: 0x20000
  flash_base_address: 0x08000000
  slots:
    exec: { base: 0x08020000, size: 0x60000 }
    staging: { base: 0x08080000, size: 0x60000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_stm32f4_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_move_stm32f4_slot0.bin
pre_boot_state:
  - { address: 0x0807FFF0, u32: 0xF395C277 }
  - { address: 0x0807FFF4, u32: 0x7FEFD260 }
  - { address: 0x0807FFF8, u32: 0x0F505235 }
  - { address: 0x0807FFFC, u32: 0x8079B62C }
  - { address: 0x0807FFE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x00020014
  marker_value: 0x00000001
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: ["driver_error"]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "60.0"
  max_step_limit: 400000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
