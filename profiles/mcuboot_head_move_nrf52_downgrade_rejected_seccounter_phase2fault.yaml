schema_version: 1
name: mcuboot_head_move_nrf52_downgrade_rejected_seccounter_phase2fault
description: >
  MCUboot HEAD swap-move on nrf52840dk with downgrade prevention and
  phase2_fault. Attempts downgrade v2->v1 with cascading power loss.
  Tests whether double fault can bypass security counter rejection.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_move_nrf52_seccounter.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
# Downgrade attempt: v2 in exec, v1 in staging.
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_seccounter_v2.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_seccounter_v1.bin
update_trigger:
  type: mcuboot_trailer_magic
  slot: staging
success_criteria:
  vtor_in_slot: exec
security_policy:
  anti_rollback: true
  minimum_version: 2
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  phase2_fault:
    enabled: true
    fault_types: [power_loss]
    max_points: 12
skip_self_test: true
expect:
  should_find_issues: false
  control_outcome: success
