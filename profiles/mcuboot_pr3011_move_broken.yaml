schema_version: 1
name: mcuboot_pr3011_move_broken
description: >
  MCUboot swap-using-move immediately before PR #3011 (commit cf36068c).
  Reproduces #3009 by cutting each secondary fixup magic word, then cutting
  each primary swap_status_init write after the primary trailer erase.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr3011_move_broken.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }
images:
  exec: results/oss_validation/assets/zephyr_head_move_nrf52_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_move_nrf52_slot0.bin
pre_boot_state:
  - { address: 0x00081FF0, u32: 0xF395C277 }
  - { address: 0x00081FF4, u32: 0x7FEFD260 }
  - { address: 0x00081FF8, u32: 0x0F505235 }
  - { address: 0x00081FFC, u32: 0x8079B62C }
  - { address: 0x00081FE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000001
  approved_image_running:
    slot: exec
    images: [staging]
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  max_step_limit: 200000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
  phase2_fault:
    enabled: true
    fault_types: [power_loss]
    pairs:
      - [2, 6]
      - [2, 7]
      - [2, 8]
      - [2, 9]
      - [2, 10]
      - [2, 11]
      - [2, 12]
      - [3, 0]
      - [3, 1]
      - [3, 2]
      - [3, 3]
      - [3, 4]
      - [3, 5]
      - [3, 6]
      - [4, 0]
      - [4, 1]
      - [4, 2]
      - [4, 3]
      - [4, 4]
      - [4, 5]
      - [4, 6]
      - [5, 0]
      - [5, 1]
      - [5, 2]
      - [5, 3]
      - [5, 4]
      - [5, 5]
      - [5, 6]
skip_self_test: true
expect:
  should_find_issues: true
