schema_version: 1
name: mcuboot_head_scratch_nrf52_revert_rc_injection_multiboot
description: >
  SWAP-SCRATCH rc_injection multi-boot: different algorithm from swap-move,
  uses scratch partition, different write ordering. May not self-heal.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash
bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_head_scratch_nrf52.elf
  entry: 0x00000000
memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x6E000 }
    staging: { base: 0x0007A000, size: 0x6E000 }
images:
  exec: results/oss_validation/assets/zephyr_head_scratch_nrf52_slot1.bin
  staging: results/oss_validation/assets/zephyr_head_scratch_nrf52_slot0.bin
pre_boot_state:
  - { address: 0x00079FF0, u32: 0xF395C277 }
  - { address: 0x00079FF4, u32: 0x7FEFD260 }
  - { address: 0x00079FF8, u32: 0x0F505235 }
  - { address: 0x00079FFC, u32: 0x8079B62C }
  - { address: 0x00079FE0, u32: 0x00000001 }
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000001
fault_sweep:
  mode: runtime
  evaluation_mode: execute
  fault_types: ["rc_injection"]
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "60.0"
  max_step_limit: 400000000
  boot_cycles: 2
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]
expect:
  should_find_issues: true
