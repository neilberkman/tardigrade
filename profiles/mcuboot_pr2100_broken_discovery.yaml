schema_version: 1
name: mcuboot_pr2100_broken_discovery
description: >
  MCUboot swap-using-move BEFORE PR #2100 fix (commit 2ac79767).
  Discovery mode: uses update_trigger instead of hand-computed
  pre_boot_state.

platform: platforms/cortex_m4_flash_fast.repl
flash_backend: faultFlash

bootloader:
  elf: results/oss_validation/assets/oss_mcuboot_pr2100_broken.elf
  entry: 0x00000000

memory:
  sram: { start: 0x20000000, end: 0x20040000 }
  write_granularity: 4
  slots:
    exec: { base: 0x0000C000, size: 0x76000 }
    staging: { base: 0x00082000, size: 0x76000 }

# Revert scenario: after a completed upgrade that was not confirmed.
images:
  exec: results/oss_validation/assets/zephyr_slot1_padded.bin
  staging: results/oss_validation/assets/zephyr_slot0_padded.bin

# Declarative trigger instead of hand-computed trailer bytes.
# mcuboot_trailer_magic writes GOOD magic at slot_end - 16.
# copy_done: 1 triggers REVERT (upgrade completed but not confirmed).
update_trigger:
  type: mcuboot_trailer_magic
  slot: exec
  copy_done: 1

# After a successful revert, exec must contain the original slot0 image.
# Check its MCUboot image-version field rather than hashing the full slot:
# the observed post-revert slot is not byte-identical to the raw staging
# fixture, so full-slot equality is not a stable differential oracle.
success_criteria:
  vtor_in_slot: exec
  marker_address: 0x0000C014
  marker_value: 0x00000001

fault_sweep:
  mode: runtime
  evaluation_mode: execute
  max_writes: auto
  max_writes_cap: 200000
  run_duration: "20.0"
  phase1_time_slice: "0.10"
  max_step_limit: 20000000
  sweep_hash_bypass_symbols: ["bootutil_img_validate"]

skip_self_test: true
expect:
  should_find_issues: true
